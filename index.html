<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>바이브코딩 모의고사</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 코딩 테스트 플랫폼 화면. 위쪽 어두운 상단바(문제명·타이머·제출), 아래는 문제 | 코드 에디터+콘솔 | AI 채팅 세 칸.
   휴대폰에선 세 칸을 탭으로 바꿈. 시작·제출·결과 화면은 같은 상단바 아래 가운데 정렬한 흰 패널. */
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#1B2430; --muted:#556072; --line:#DDE2E9; --soft:#F6F8FA;
  --head:#1F2B37; --head-ink:#E9EEF3; --head-muted:#9AA8B6;
  --accent:#2F6FEB; --accent-ink:#FFFFFF; --accent-soft:#EAF1FE;
  --ok:#1A7F4B; --ok-soft:#E7F5EE; --bad:#D1323F; --bad-soft:#FDECEE; --warn:#B26A00;
  --code-bg:#1E2630; --code-ink:#DDE3EA; --code-muted:#7C8896; --code-line:#2A3440; --code-sel:#2F4157;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217; --panel:#161B22; --ink:#E6EBF1; --muted:#9BA6B4; --line:#2A313B; --soft:#1C222B;
  --head:#0A0E13; --head-ink:#E6EBF1; --head-muted:#8593A2;
  --accent:#5B8DEF; --accent-ink:#0B1220; --accent-soft:#1B2840;
  --ok:#4CC38A; --ok-soft:#14261E; --bad:#F06A74; --bad-soft:#2C1619; --warn:#F2B35A;
  --code-bg:#11161D; --code-ink:#DDE3EA; --code-muted:#6E7A88; --code-line:#1E252E; --code-sel:#26384E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217; --panel:#161B22; --ink:#E6EBF1; --muted:#9BA6B4; --line:#2A313B; --soft:#1C222B;
  --head:#0A0E13; --head-ink:#E6EBF1; --head-muted:#8593A2;
  --accent:#5B8DEF; --accent-ink:#0B1220; --accent-soft:#1B2840;
  --ok:#4CC38A; --ok-soft:#14261E; --bad:#F06A74; --bad-soft:#2C1619; --warn:#F2B35A;
  --code-bg:#11161D; --code-ink:#DDE3EA; --code-muted:#6E7A88; --code-line:#1E252E; --code-sel:#26384E; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:12.5px;color:var(--muted);font-weight:500}

/* 공통 상단바 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);
  display:flex;align-items:center;gap:16px;min-height:52px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
.topbar .crumb{color:var(--head-muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .grow{flex:1}

/* 시작·제출·결과 화면 */
.wrap{max-width:860px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card > h2{font-size:17px;font-weight:700}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.01em}
.ticket{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.ticket span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:15px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{border:1px solid var(--line);background:var(--panel);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:var(--r);transition:border-color .15s}
.choice:hover{border-color:var(--accent)}
.choice b{font-size:15px;font-weight:600}
.choice small{color:var(--muted);font-size:13px;line-height:1.5}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.mins .choice{flex:1 1 0;min-width:72px;text-align:center;align-items:center}
@media (max-width:560px){.choices,.choices.two{grid-template-columns:1fr}}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;font-weight:600;font-size:14.5px;border-radius:6px;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.pen{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 11px;font-size:13.5px;min-height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.topbar .btn.ghost{background:transparent;color:var(--head-ink);border-color:#3A4856}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:13.5px}
.linkbtn:hover{text-decoration:underline}

.notice{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--soft);border-radius:6px;padding:12px 14px;font-size:14.5px}
.notice.pen{border-left-color:var(--bad);background:var(--bad-soft)}
.facts{display:grid;gap:10px;margin:8px 0 0;font-size:14.5px}
.facts dt{font-weight:600;font-size:14px}
.facts dd{margin:2px 0 0}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:0 7px;margin-right:6px;border-radius:999px;vertical-align:1px}
.chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.guess{color:var(--warn);background:var(--soft);border:1px solid var(--line)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input[type=password],.field input[type=text]{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 11px;font:inherit;font-family:var(--f-mono);font-size:14px;border-radius:6px}
.field .hint{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;border-radius:6px}
pre{margin:0;background:var(--soft);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;border-radius:6px;white-space:pre}
code{font-family:var(--f-mono);font-size:.92em;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--bad)}
.stream{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);max-height:160px;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
.tips{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.rules{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}

.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:left;border-bottom:1px solid var(--line);padding:6px 6px}
.hist td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}
.hist td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hist td.s{font-weight:700;color:var(--accent)}
.hist a{color:var(--ink);font-weight:600;text-decoration:none}
.hist a:hover{color:var(--accent);text-decoration:underline}
.tablewrap{overflow-x:auto}

/* 시작·제출·결과 화면의 덩어리를 카드로 */
.wrap > .section,.wrap > details,.wrap > .block,.wrap > .crit,.wrap > .score,.wrap > .self{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.wrap > details{border-top:1px solid var(--line)}
#app.ide{height:100%}

/* 문제지 공통 */
.qhead{display:flex;flex-direction:column;gap:4px}
.qnum{font-size:12.5px;color:var(--muted)}
.qtitle{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.block{display:flex;flex-direction:column;gap:8px}
.block h3{font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:500;border:1px solid var(--line);padding:0 7px;border-radius:999px;color:var(--muted)}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.reqs li + li{border-top:1px solid var(--line)}
.reqs label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;padding:9px 12px;cursor:pointer;align-items:start;font-size:14.5px}
.reqs input{width:16px;height:16px;margin:4px 0 0;accent-color:var(--accent)}
.reqs input:checked + span{color:var(--muted);text-decoration:line-through}

/* ───── 시험 화면 (IDE) ───── */
.ide{height:100%;display:flex;flex-direction:column;min-height:0}
.ide-top{flex:none}
.timer{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em;padding:2px 10px;border-radius:6px;background:#2A3846;color:var(--head-ink)}
.timer.low{background:var(--bad);color:#fff}
.meter{font-size:13px;color:var(--head-muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.meter b{color:var(--head-ink);font-weight:600}
.meter .warn b{color:#FF8A93}
.phasebar{flex:none;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:38px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px}
.phases{display:grid;grid-template-columns:10fr 50fr 25fr 15fr;gap:3px;width:180px;flex:none}
.ph{height:5px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.ph i{position:absolute;inset:0;width:0;background:var(--accent)}
.phase-now{display:flex;gap:8px;align-items:baseline;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.phase-now b{color:var(--accent);font-weight:600}
.phase-now span{overflow:hidden;text-overflow:ellipsis}
.mtabs{display:none}
.ide-main{flex:1;min-height:0;display:grid;grid-template-columns:var(--w1,30%) 6px minmax(0,1fr) 6px var(--w3,30%)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.pane-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:var(--soft)}
.pane-body{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.gutter{background:var(--bg);cursor:col-resize;position:relative}
.gutter::after{content:"";position:absolute;top:50%;left:2px;width:2px;height:28px;margin-top:-14px;border-radius:2px;background:var(--line)}
.gutter:hover::after,.gutter.drag::after{background:var(--accent)}
/* 코드 칸 */
.p-code{background:var(--code-bg);color:var(--code-ink)}
.filetabs{flex:none;display:flex;align-items:stretch;height:38px;background:#171E26;border-bottom:1px solid var(--code-line);overflow-x:auto}
.ftab{display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;font-family:var(--f-mono);font-size:13px;color:var(--code-muted);border-right:1px solid var(--code-line);white-space:nowrap;background:none;border-top:0;border-left:0;border-bottom:2px solid transparent}
.ftab[aria-selected="true"]{color:var(--code-ink);background:var(--code-bg);border-bottom-color:var(--accent)}
.ftab .x{opacity:.6;padding:2px 6px;border-radius:4px}
.ftab .x:hover{opacity:1;background:var(--code-line)}
.ftab-add{background:none;border:0;color:var(--code-muted);padding:0 12px;font-size:18px}
.ftab-add:hover{color:var(--code-ink)}
.editor{flex:1;min-height:0;position:relative}
.editor textarea.fallback{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:var(--code-bg);color:var(--code-ink);padding:12px 14px;resize:none;tab-size:4;white-space:pre;overflow:auto;font-size:14px}
.hgutter{flex:none;height:6px;background:#171E26;cursor:row-resize;position:relative;border-top:1px solid var(--code-line)}
.hgutter::after{content:"";position:absolute;left:50%;top:2px;height:2px;width:28px;margin-left:-14px;border-radius:2px;background:var(--code-line)}
.hgutter:hover::after,.hgutter.drag::after{background:var(--accent)}
.console{flex:none;height:var(--hc,34%);min-height:120px;display:flex;flex-direction:column;background:#151B22}
.console-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 8px 0 0;border-bottom:1px solid var(--code-line)}
.ctabs{display:flex;height:100%}
.ctab{background:none;border:0;border-bottom:2px solid transparent;color:var(--code-muted);font-size:13px;font-weight:600;padding:0 14px}
.ctab[aria-selected="true"]{color:var(--code-ink);border-bottom-color:var(--accent)}
.console-bar .btn.sm{min-height:28px;padding:3px 10px;font-size:13px}
.console-bar .btn.ghost{background:transparent;color:var(--code-ink);border-color:#3A4654}
.console-body{flex:1;min-height:0;display:flex;flex-direction:column}
.console-body textarea{flex:1;min-height:0;border:0;border-radius:0;resize:none;background:transparent;color:var(--code-ink);font-size:13px;padding:10px 14px}
.console-status{flex:none;font-size:12.5px;color:var(--code-muted);padding:4px 14px;border-top:1px solid var(--code-line);min-height:26px}
.console-status.err{color:#FF8A93}
/* AI 칸 */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg .who{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .body{min-width:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.7}
.msg.me{align-items:flex-end}
.msg.me .body{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px 10px 2px 10px;padding:9px 12px;max-width:92%}
.msg.ai .body{width:100%}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.codebox{border:1px solid var(--code-line);border-radius:6px;overflow:hidden;background:var(--code-bg)}
.codebox .cb-bar{display:flex;justify-content:flex-end;gap:6px;background:#171E26;padding:4px 6px}
.codebox .cb-bar button{border:1px solid #3A4654;background:transparent;color:var(--code-ink);font-size:12px;padding:2px 9px;border-radius:4px}
.codebox .cb-bar button:hover{border-color:var(--accent)}
.codebox pre{border:0;border-radius:0;background:transparent;color:var(--code-ink)}
.empty{color:var(--muted);font-size:14px;line-height:1.7}
.composer{flex:none;border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.composer textarea{min-height:76px;max-height:40vh;font-family:var(--f-body);font-size:14.5px;line-height:1.6}
.composer .opts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.composer label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted)}
.composer input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
/* 시작 전 안내 */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,19,.55);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.overlay .card{max-width:560px;width:100%;max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}

/* 휴대폰: 세 칸을 탭으로 */
@media (max-width:900px){
  .meter{display:none}
  .topbar .crumb{display:none}
  .phases{width:90px}
  .mtabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-bottom:1px solid var(--line)}
  .mtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;font-size:14px;font-weight:600;color:var(--muted)}
  .mtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .ide-main{display:flex;flex-direction:column}
  .gutter{display:none}
  .pane{flex:1}
  .pane[data-m-hidden]{display:none}
  .console{height:auto;flex:1}
  .p-code[data-mt="code"] .console,.p-code[data-mt="run"] .editor,.p-code[data-mt="run"] .filetabs,.p-code .hgutter{display:none}
  .p-code[data-mt="run"] .console{display:flex}
}

/* 채점 결과 */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1%), var(--line) 0);position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
.ring > div{position:relative;line-height:1}
.ring b{font-size:36px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.ring small{font-size:13px;color:var(--muted)}
.score-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.score-side .pen{font-size:14px;font-weight:700;color:var(--accent)}
.crit{display:flex;flex-direction:column;gap:14px}
.crow{display:flex;flex-direction:column;gap:5px}
.crow-top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.crow-top b{font-weight:600}
.crow-top span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.crow p{font-size:14px;color:var(--muted)}
.penlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.penlist li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:14.5px}
.penlist li::before{content:"✓";font-weight:700;color:var(--ok)}
.penlist.fix li::before{content:"→";color:var(--bad)}
.penlist.q li::before{content:"Q";font-weight:700;font-size:13px;color:var(--accent);line-height:1.7}
.hidden-checks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.hidden-checks li{padding:9px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.hidden-checks li + li{border-top:1px solid var(--line)}
.mark{font-weight:700;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-top:2px}
.mark.o{color:var(--ok);background:var(--ok-soft)} .mark.x{color:var(--bad);background:var(--bad-soft)} .mark.q{color:var(--muted);background:var(--soft)}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.stats b{color:var(--ink)}
.self{display:flex;flex-direction:column;gap:14px}
.self-row{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{border:1px solid var(--line);background:var(--panel);padding:7px 6px;font-size:13.5px;border-radius:6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
@media (max-width:460px){.score{grid-template-columns:1fr;justify-items:start}}

<script type="text/plain" id="hid-prelude">
import sys
import pytest
from fastapi.testclient import TestClient


def _fresh_app():
    # 테스트마다 main을 새로 불러와 저장된 상태를 비움
    for name in list(sys.modules):
        if name == "main" or name.startswith("main."):
            del sys.modules[name]
    import main
    return main.app


@pytest.fixture
def c():
    return TestClient(_fresh_app())


def code_of(r):
    try:
        j = r.json()
    except Exception:
        return None
    if isinstance(j, dict):
        if "code" in j:
            return j["code"]
        d = j.get("detail")
        if isinstance(d, dict):
            return d.get("code")
    return None

<script type="text/plain" id="hid-sw-parcel">
STEPS = ["집화", "간선이동", "배송출발", "배송완료"]


def mk(c, no="P1"):
    return c.post("/parcels", json={"tracking_no": no, "receiver": "김OO", "dest": "서울 용산구"})


def ev(c, no, st, at):
    return c.post(f"/parcels/{no}/events", json={"status": st, "at": at})


def test_01_create_get(c):
    """송장 등록 직후 상태는 접수, 이력은 빈 목록"""
    r = mk(c)
    assert r.status_code == 201
    assert r.json()["status"] == "접수"
    g = c.get("/parcels/P1")
    assert g.status_code == 200
    j = g.json()
    assert j["status"] == "접수" and j["history"] == [] and j["receiver"] == "김OO"


def test_02_duplicate_parcel(c):
    """같은 송장번호를 다시 등록하면 409"""
    mk(c)
    assert mk(c).status_code == 409


def test_03_full_flow(c):
    """접수부터 배송완료까지 순서대로 진행"""
    mk(c)
    for i, s in enumerate(STEPS):
        r = ev(c, "P1", s, f"2026-10-21T0{i + 1}:00:00+09:00")
        assert r.status_code == 201, (s, r.status_code)
    j = c.get("/parcels/P1").json()
    assert j["status"] == "배송완료"
    assert [h["status"] for h in j["history"]] == STEPS


def test_04_skip_step(c):
    """단계를 건너뛴 이벤트는 409, 상태는 그대로"""
    mk(c)
    assert ev(c, "P1", "간선이동", "2026-10-21T01:00:00+09:00").status_code == 409
    assert c.get("/parcels/P1").json()["status"] == "접수"


def test_05_backward(c):
    """배송완료 뒤 거꾸로 가는 이벤트는 409"""
    mk(c)
    for i, s in enumerate(STEPS):
        ev(c, "P1", s, f"2026-10-21T0{i + 1}:00:00+09:00")
    assert ev(c, "P1", "집화", "2026-10-21T09:00:00+09:00").status_code == 409
    assert c.get("/parcels/P1").json()["status"] == "배송완료"


def test_06_idempotent_event(c):
    """같은 이벤트를 다시 보내면 200, 이력은 한 줄"""
    mk(c)
    a = ev(c, "P1", "집화", "2026-10-21T01:00:00+09:00")
    b = ev(c, "P1", "집화", "2026-10-21T01:00:00+09:00")
    assert a.status_code == 201 and b.status_code == 200
    assert len(c.get("/parcels/P1").json()["history"]) == 1


def test_07_not_found(c):
    """없는 송장 조회·이벤트는 404"""
    assert c.get("/parcels/NOPE").status_code == 404
    assert ev(c, "NOPE", "집화", "2026-10-21T01:00:00+09:00").status_code == 404


def test_08_unknown_status(c):
    """모르는 상태 이름은 400 또는 422"""
    mk(c)
    assert ev(c, "P1", "분실", "2026-10-21T01:00:00+09:00").status_code in (400, 422)


def test_09_delayed_timezone(c):
    """지연 목록: UTC(Z) 시각 섞임, 배송완료 제외, 경로 순서"""
    for no in ["A", "B", "C"]:
        mk(c, no)
        ev(c, no, "집화", "2026-10-19T10:00:00+09:00")
        ev(c, no, "간선이동", "2026-10-19T12:00:00+09:00")
    ev(c, "A", "배송출발", "2026-10-19T23:00:00Z")
    ev(c, "B", "배송출발", "2026-10-21T08:00:00+09:00")
    ev(c, "C", "배송출발", "2026-10-20T07:00:00+09:00")
    ev(c, "C", "배송완료", "2026-10-20T15:00:00+09:00")
    r = c.get("/parcels/delayed", params={"now": "2026-10-21T10:00:00+09:00"})
    assert r.status_code == 200
    assert sorted(r.json()) == ["A"]
</script>
<script type="text/plain" id="hid-sw-seat">
def show(c):
    r = c.post("/shows", json={})
    assert r.status_code == 201
    return r.json()["id"]


def book(c, s, seats, u="u1"):
    return c.post(f"/shows/{s}/bookings", json={"seats": seats, "user": u})


def booked(c, s):
    return set(c.get(f"/shows/{s}/seats").json()["booked"])


def test_01_book(c):
    """두 좌석 예매"""
    s = show(c)
    assert book(c, s, ["E7", "E8"]).status_code == 201
    assert booked(c, s) == {"E7", "E8"}


def test_02_conflict(c):
    """이미 예매된 좌석은 409"""
    s = show(c)
    book(c, s, ["E7"])
    assert book(c, s, ["E7"], "u2").status_code == 409


def test_03_all_or_nothing(c):
    """4좌석 중 1좌석이 찼으면 나머지도 안 잡힘"""
    s = show(c)
    book(c, s, ["E8"])
    assert book(c, s, ["E6", "E7", "E8", "E9"], "u2").status_code == 409
    assert booked(c, s) == {"E8"}


def test_04_cancel_rebook(c):
    """취소한 좌석은 다시 예매 가능"""
    s = show(c)
    bid = book(c, s, ["A1"]).json()["booking_id"]
    assert c.delete(f"/bookings/{bid}").status_code in (200, 204)
    assert book(c, s, ["A1"], "u2").status_code == 201


def test_05_invalid_seat(c):
    """K열, 0번, 13번 같은 범위 밖 좌석은 400 또는 422"""
    s = show(c)
    for bad in (["K1"], ["A0"], ["A13"], ["11"]):
        assert book(c, s, bad).status_code in (400, 422), bad
    assert booked(c, s) == set()


def test_06_empty_and_dup(c):
    """빈 목록과 같은 좌석 중복은 400 또는 422"""
    s = show(c)
    assert book(c, s, []).status_code in (400, 422)
    assert book(c, s, ["B2", "B2"]).status_code in (400, 422)
    assert booked(c, s) == set()


def test_07_shows_independent(c):
    """회차가 다르면 같은 좌석도 따로 예매"""
    a = show(c)
    b = show(c)
    book(c, a, ["C3"])
    assert book(c, b, ["C3"]).status_code == 201


def test_08_not_found(c):
    """없는 회차·예매는 404"""
    assert c.get("/shows/99999/seats").status_code == 404
    assert book(c, 99999, ["A1"]).status_code == 404
    assert c.delete("/bookings/99999").status_code == 404

<script type="text/plain" id="hid-sw-coupon">
def camp(c, total=3, exp="2026-10-31T23:59:59+09:00"):
    r = c.post("/campaigns", json={"name": "가을 15%", "total": total, "expires_at": exp})
    assert r.status_code == 201
    return r.json()["id"]


def issue(c, cid, u):
    return c.post(f"/campaigns/{cid}/issue", json={"user": u})


def test_01_create(c):
    """행사를 만들면 남은 수량이 총 수량과 같음"""
    cid = camp(c)
    j = c.get(f"/campaigns/{cid}").json()
    assert j["total"] == 3 and j["remaining"] == 3


def test_02_sold_out(c):
    """수량이 다 떨어지면 409 SOLD_OUT"""
    cid = camp(c, total=2)
    assert issue(c, cid, "u1").status_code == 201
    assert issue(c, cid, "u2").status_code == 201
    r = issue(c, cid, "u3")
    assert r.status_code == 409 and code_of(r) == "SOLD_OUT"
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 0


def test_03_one_per_user(c):
    """같은 사람이 두 번 받으면 409 ALREADY_ISSUED, 수량은 그대로"""
    cid = camp(c)
    issue(c, cid, "u1")
    r = issue(c, cid, "u1")
    assert r.status_code == 409 and code_of(r) == "ALREADY_ISSUED"
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 2


def test_04_use_twice(c):
    """사용 처리를 두 번 하면 두 번째는 409 ALREADY_USED"""
    cid = camp(c)
    k = issue(c, cid, "u1").json()["coupon_id"]
    a = c.post(f"/coupons/{k}/use", json={"now": "2026-10-25T12:00:00+09:00"})
    assert a.status_code == 200 and a.json()["used"] is True
    b = c.post(f"/coupons/{k}/use", json={"now": "2026-10-25T12:01:00+09:00"})
    assert b.status_code == 409 and code_of(b) == "ALREADY_USED"


def test_05_expired_utc(c):
    """UTC로 온 시각이 한국 시각으로 만료 뒤면 409 EXPIRED"""
    cid = camp(c, exp="2026-10-31T23:59:59+09:00")
    k = issue(c, cid, "u1").json()["coupon_id"]
    r = c.post(f"/coupons/{k}/use", json={"now": "2026-10-31T15:00:00Z"})
    assert r.status_code == 409 and code_of(r) == "EXPIRED"


def test_06_not_found(c):
    """없는 행사·쿠폰은 404"""
    assert c.get("/campaigns/99999").status_code == 404
    assert issue(c, 99999, "u1").status_code == 404
    assert c.post("/coupons/99999/use", json={"now": "2026-10-25T12:00:00+09:00"}).status_code == 404


def test_07_user_list(c):
    """내 쿠폰 목록"""
    a = camp(c)
    b = camp(c)
    issue(c, a, "u1")
    issue(c, b, "u1")
    issue(c, a, "u2")
    j = c.get("/users/u1/coupons").json()
    assert len(j) == 2 and all(x["used"] is False for x in j)


def test_08_failed_issue_keeps_count(c):
    """실패한 발급은 수량·목록에 남지 않음"""
    cid = camp(c, total=1)
    issue(c, cid, "u1")
    issue(c, cid, "u1")
    issue(c, cid, "u2")
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 0
    assert c.get("/users/u2/coupons").json() == []
</script>
<script type="text/plain" id="hid-de-orders">
CSV = (
    "order_id,ordered_at,category,amount\n"
    "A1001,2026-10-20T23:40:00+09:00,뷰티,18900\n"
    "A1001,2026-10-20T23:40:00+09:00,뷰티,18900\n"
    "A1002,2026-10-20T15:05:00Z,식품,12000\n"
    "A1003,2026-10-21T00:10:00+09:00,뷰티,-5000\n"
    "A1004,2026-10-21T09:00:00+09:00,뷰티,\n"
    "A1005,2026-10-21T10:00:00+09:00,식품,3000\n"
    "A1006,2026-10-20T14:59:00Z,식품,1000\n"
)


def up(c, text=CSV):
    r = c.post("/orders/upload", json={"csv": text})
    assert r.status_code == 200, r.text
    return r.json()


def sales(c, d):
    r = c.get("/sales", params={"date": d})
    assert r.status_code == 200
    return {x["category"]: (x["revenue"], x["orders"]) for x in r.json()}


def test_01_report(c):
    """처리 리포트 건수 (입력 7 · 정제 4 · 중복 1 · 격리 2)"""
    j = up(c)
    assert (j["input"], j["clean"], j["duplicates"], j["quarantined"]) == (7, 4, 1, 2)


def test_02_sum(c):
    """정제 + 중복 + 격리 = 입력"""
    j = up(c)
    assert j["clean"] + j["duplicates"] + j["quarantined"] == j["input"]


def test_03_sales_kst(c):
    """UTC 시각을 한국 날짜로 바꿔 집계 (20일)"""
    up(c)
    assert sales(c, "2026-10-20") == {"뷰티": (18900, 1), "식품": (1000, 1)}


def test_04_sales_next_day(c):
    """UTC 15:05는 한국 시각으로 다음 날 (21일)"""
    up(c)
    assert sales(c, "2026-10-21") == {"식품": (15000, 2)}


def test_05_quarantine(c):
    """음수·빈 금액은 격리 목록에"""
    up(c)
    q = c.get("/quarantine").json()
    assert sorted(x["order_id"] for x in q) == ["A1003", "A1004"]


def test_06_reupload_idempotent(c):
    """같은 파일을 다시 올려도 매출·격리가 늘지 않음"""
    up(c)
    j = up(c)
    assert j["clean"] == 0 and j["duplicates"] == 7
    assert sales(c, "2026-10-21") == {"식품": (15000, 2)}
    assert len(c.get("/quarantine").json()) == 2


def test_07_no_sales_day(c):
    """주문이 없는 날은 빈 목록"""
    up(c)
    assert c.get("/sales", params={"date": "2026-10-25"}).json() == []
</script>

H = "store_id,sku,qty,snapshot_date\n"


def snap(c, body):

def inv(c, s, k):
    return c.get(f"/inventory/{s}/{k}")


def test_01_insert(c):

const STARTER_API = "from fastapi import FastAPI, HTTPException\n\napp = FastAPI()\n\n";
const STARTER_DATA = "# 여기에 풀이를 작성하세요\n";
// 답안 파일 목록 ↔ 한 덩어리 문자열(S.code). 채점·실행은 S.code를 '# --- 파일명 ---' 구분선으로 나눠 씀
function serializeFiles(files){ return files.map(f => `# --- ${f.name} ---\n${f.body.replace(/\s+$/,"")}\n`).join("\n"); }
function ensureFiles(){
  if(Array.isArray(S.files) && S.files.length) return;
  const parsed = S.code && S.code.trim() ? parseFiles(S.code) : { "main.py": (S.task && S.task.type==="api") ? STARTER_API : STARTER_DATA };
  S.files = Object.entries(parsed).map(([name, body]) => ({ name, body }));
  S.active = 0;
  S.code = serializeFiles(S.files);
}
function syncCode(){ S.code = serializeFiles(S.files); updateCount(); saveDraft(); }
function activeFile(){ ensureFiles(); return S.files[Math.min(S.active||0, S.files.length-1)]; }

function renderBody(text, idx){
  const parts = []; let last = 0, n = 0;
  const re = /```[^\n]*\n?([\s\S]*?)```/g; let m;
  while((m = re.exec(text))){
    if(m.index>last) parts.push(`<div class="txt">${esc(text.slice(last,m.index).trim())}</div>`);
    parts.push(`<div class="codebox"><div class="cb-bar"><button data-copy="${idx}:${n}">복사</button><button data-apply="${idx}:${n}">에디터에 넣기</button></div><pre>${esc(m[1])}</pre></div>`);
    last = re.lastIndex; n++;
  }
  if(last < text.length) parts.push(`<div class="txt">${esc(text.slice(last).trim())}</div>`);
  return parts.join("");
}
function codeBlocks(text){ const out=[]; const re=/```[^\n]*\n?([\s\S]*?)```/g; let m; while((m=re.exec(text))) out.push(m[1]); return out; }
function msgHtml(m,i){
  const time = m.at ? new Date(m.at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "";
  return `<div class="msg ${m.role==="user"?"me":"ai"}" data-i="${i}"><div class="who">${m.role==="user"?"나":"AI"} · ${esc(time)}${m.attached?` · 코드 ${m.attached.toLocaleString()}자 첨부`:""}</div>
    <div class="body">${m.role==="user"?`<div class="txt">${esc(m.content)}</div>`:renderBody(m.content,i)}</div></div>`;
}

/* 에디터: CodeMirror가 있으면 쓰고, 못 불러왔으면 일반 입력칸 */
let cm = null;
function initEditor(){
  const host = document.getElementById("editor"); if(!host) return;
  cm = null;
  const f = activeFile();
  const mode = /\.py$/.test(f.name) ? "python" : null;
  if(window.CodeMirror){ try{
    cm = window.CodeMirror(host, { value: f.body, mode, lineNumbers:true, indentUnit:4, tabSize:4, indentWithTabs:false,
      matchBrackets:true, autoCloseBrackets:true, styleActiveLine:true, lineWrapping:false, viewportMargin:30,
      readOnly: S.startedAt && !S.finishedAt ? false : "nocursor",
      extraKeys:{ Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    "), "Shift-Tab": c => c.indentSelection("subtract") } });
    cm.on("change", () => { const af = activeFile(); af.body = cm.getValue(); syncCode(); });
  }catch(e){ cm = null; host.innerHTML = ""; } }
  if(!cm){
    host.innerHTML = `<textarea id="code" class="fallback" spellcheck="false" ${S.startedAt && !S.finishedAt ? "" : "readonly"}>${esc(f.body)}</textarea>`;
  }
  updateCount();
}
function insertIntoEditor(text){
  if(cm){
    cm.focus();
    const v = cm.getValue().trim();
    if(!v || v === STARTER_API.trim() || v === STARTER_DATA.trim()) cm.setValue(text); else cm.replaceSelection(text);
    return;
  }
  const af = activeFile();
  af.body = af.body.trim() ? af.body.replace(/\s*$/,"") + "\n\n" + text : text;
  const ta = document.getElementById("code"); if(ta) ta.value = af.body;
  syncCode();
}

function updateClock(){
  const el = document.getElementById("clock"); if(!el) return;
  const e = elapsed(), left = limitMs()-e, ratio = Math.min(1, e/limitMs());
  el.textContent = left>=0 ? fmt(left) : "+"+fmt(-left);
  el.classList.toggle("low", left < 10*60000);
  let start = 0;
  PHASES.forEach((p,i)=>{ const ph=document.getElementById("ph"+i); if(!ph) return;
    ph.querySelector("i").style.width = (Math.max(0,Math.min(1,(ratio-start)/(p.until-start)))*100)+"%"; start=p.until; });
  const cur = PHASES.find(p=>ratio < p.until) || PHASES[PHASES.length-1];
  const pn = document.getElementById("phaseNow");
  if(pn){
    const txt = !S.startedAt ? `<b>준비</b><span class="muted">시험 안내를 읽고 시작하세요.</span>`
      : S.pausedAt ? `<b>일시정지</b><span class="muted">실제 시험에선 멈출 수 없어요.</span>`
      : left < 0 ? `<b>시간 초과</b><span class="muted">실제 시험이라면 지금 제출해야 해요.</span>`
      : `<b>${esc(cur.name)}</b><span class="muted">${esc(cur.hint)}</span>`;
    if(pn.dataset.v !== txt){ pn.innerHTML = txt; pn.dataset.v = txt; }
  }
  updateMeter();
}

/* 칸 너비·콘솔 높이 끌어서 조절 */
function bindResizers(){
  const main = document.getElementById("ideMain"); if(!main) return;
  main.querySelectorAll("[data-gutter]").forEach(g => {
    g.addEventListener("pointerdown", ev => {
      ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add("drag");
      const rect = main.getBoundingClientRect();
      const move = e => {
        const x = (e.clientX - rect.left) / rect.width * 100;
        S.layout = S.layout || {};
        if(g.dataset.gutter === "1") S.layout.w1 = Math.max(18, Math.min(50, x));
        else S.layout.w3 = Math.max(20, Math.min(50, 100 - x));
        main.style.setProperty("--w1", (S.layout.w1||30) + "%"); main.style.setProperty("--w3", (S.layout.w3||30) + "%");
        if(cm) cm.refresh();
      };
      const up = () => { g.classList.remove("drag"); g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); saveDraft(); };
      g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
    });
  });
  const hg = document.getElementById("hgutter"), pc = main.querySelector(".p-code");
  if(hg && pc) hg.addEventListener("pointerdown", ev => {
    ev.preventDefault(); hg.setPointerCapture(ev.pointerId); hg.classList.add("drag");
    const rect = pc.getBoundingClientRect();
    const move = e => { S.layout = S.layout || {}; S.layout.hc = Math.max(15, Math.min(75, (rect.bottom - e.clientY) / rect.height * 100)); pc.style.setProperty("--hc", S.layout.hc + "%"); if(cm) cm.refresh(); };
    const up = () => { hg.classList.remove("drag"); hg.removeEventListener("pointermove", move); hg.removeEventListener("pointerup", up); saveDraft(); };
    hg.addEventListener("pointermove", move); hg.addEventListener("pointerup", up);
  });
}

/* ───────── 화면 안 파이썬 실행 ───────── */
let worker = null, runBusy = false, runStatusText = "", runTimer = null, bootTimer = null;
const RUN_LIMIT_MS = 30000;    // 한 번 실행이 이보다 길면 무한 루프로 보고 멈춤
const BOOT_LIMIT_MS = 180000;  // 첫 로딩(약 10~40MB 다운로드)을 기다리는 최대 시간
function parseFiles(code){
  const re = /^#\s*---\s*([\w.\-\/]+)\s*---\s*$/gm;
  const marks = [...code.matchAll(re)];
  if(!marks.length) return { "main.py": code };
  const files = {};
  marks.forEach((m,i)=>{
    const start = m.index + m[0].length + 1, end = i+1<marks.length ? marks[i+1].index : code.length;
    const name = m[1].replace(/^\/+/,"").replace(/\.\.+/g,".");
    files[name] = code.slice(start, end).replace(/\s+$/,"") + "\n";
  });
  return files;
}
function setRunStatus(t, err){ runStatusText=t; const el=document.getElementById("runStatus"); if(el){ el.textContent=t; el.className="console-status"+(err?" err":""); } }
function setRunBusy(b){ runBusy=b; const a=document.getElementById("runMain"), t=document.getElementById("runTest"), s=document.getElementById("runStop");
  if(a) a.disabled=b; if(t) t.disabled=b; if(s) s.hidden=!b; }
function appendRun(text){ S.run += text; const el=document.getElementById("run"); if(el){ el.value=S.run; el.scrollTop=el.scrollHeight; } saveDraft(); }
function killWorker(){ if(worker){ worker.terminate(); worker=null; } clearTimeout(runTimer); clearTimeout(bootTimer); }
let hiddenWait = null;   // 숨은 테스트를 기다리는 중이면 {resolve, onStatus}
function finishHidden(val){ const w=hiddenWait; hiddenWait=null; clearTimeout(runTimer); clearTimeout(bootTimer); setRunBusy(false); if(w) w.resolve(val); }
function getWorker(){
  if(worker) return worker;
  worker = new Worker("py-worker.js");
  worker.onmessage = ev => {
    const m = ev.data || {};
    if(hiddenWait){
      if(m.type==="status") hiddenWait.onStatus(m.text);
      else if(m.type==="started"){ clearTimeout(bootTimer); runTimer=setTimeout(()=>{ killWorker(); finishHidden({error:"숨은 테스트가 60초 안에 끝나지 않았어요. 무한 루프가 있는지 확인해 보세요."}); }, 60000); }
      else if(m.type==="hidden") finishHidden({rows:m.rows});
      else if(m.type==="fail"){ killWorker(); finishHidden({error:m.text}); }
      return;
    }
    if(m.type==="status") setRunStatus(m.text);
    else if(m.type==="started"){ clearTimeout(bootTimer); runTimer=setTimeout(()=>{ killWorker(); appendRun(`\n[시간 초과: ${RUN_LIMIT_MS/1000}초 넘게 실행돼서 멈췄어요. 무한 루프인지 확인해 보세요]\n`); setRunStatus("시간 초과로 멈췄어요. 다음 실행 땐 환경을 다시 불러와요.", true); setRunBusy(false); }, RUN_LIMIT_MS); }
    else if(m.type==="out") appendRun(m.chunks.map(c=>c.text).join(""));
    else if(m.type==="done"){ clearTimeout(runTimer); appendRun(`\n[종료 코드 ${m.code} · ${m.ms}ms]\n`); setRunStatus(m.code===0?"끝났어요.":"오류나 실패가 있어요. 출력을 확인하세요.", m.code!==0); setRunBusy(false); }
    else if(m.type==="fail"){ killWorker(); appendRun(`\n[실행 환경 오류] ${m.text}\n`); setRunStatus("실행 환경에서 오류가 났어요. 다시 눌러 보고, 계속되면 내 PC에서 돌려 결과를 붙여 넣어 주세요.", true); setRunBusy(false); }
  };
  worker.onerror = e => {
    e.preventDefault && e.preventDefault(); killWorker();
    if(hiddenWait){ finishHidden({error:"이 화면에서 파이썬을 띄우지 못했어요."}); return; }
    setRunStatus("이 화면에서 파이썬을 띄우지 못했어요. 내 PC에서 돌린 뒤 결과를 붙여 넣어 주세요.", true); setRunBusy(false);
  };
  return worker;
}
/* 제출할 때 숨은 테스트를 돌려 {rows} 또는 {error}를 돌려줌 */
function runHidden(onStatus){
  return new Promise(resolve => {
    if(runBusy){ killWorker(); setRunBusy(false); }
    const T = S.task;
    const code = hiddenCode("prelude") + "\n" + (T.hiddenCode || hiddenCode(T.id));
    hiddenWait = { resolve, onStatus: onStatus || (()=>{}) };
    setRunBusy(true);
    try{
      const w = getWorker();
      bootTimer = setTimeout(()=>{ killWorker(); finishHidden({error:"실행 환경을 불러오지 못했어요(시간 초과)."}); }, BOOT_LIMIT_MS);
      w.postMessage({ type:"run", cmd:"hidden", files:parseFiles(S.code), hidden:code });
    }catch(e){ killWorker(); finishHidden({error:"이 화면에서 파이썬을 띄우지 못했어요."}); }
  });
}
function summarizeHidden(res){
  if(!res || res.error) return { error: res ? res.error : "숨은 테스트를 돌리지 못했어요." };
  const docs = {};
  const src = (S.task.hiddenCode || hiddenCode(S.task.id));
  for(const m of src.matchAll(/def (test_\w+)\([^)]*\):\s*\n\s*"""([^"]+)"""/g)) docs[m[1]] = m[2].trim();
  const rows = res.rows.filter(r=>r.name.startsWith("test_")).map(r=>({ name:r.name, desc:docs[r.name]||r.name, ok:r.outcome==="passed", msg:r.msg }));
  const broken = res.rows.find(r=>!r.name.startsWith("test_"));
  if(!rows.length) return { error: broken ? "테스트를 시작하지 못했어요: " + broken.msg.split("\n").filter(Boolean).slice(-1)[0] : "실행된 테스트가 없어요." };
  return { rows, passed: rows.filter(r=>r.ok).length, total: rows.length };
}
function runCode(cmd){
  if(runBusy) return;
  if(!S.startedAt){ setRunStatus("시작을 누른 뒤 실행할 수 있어요.", true); return; }
  const files = parseFiles(S.code);
  const names = Object.keys(files);
  if(!S.code.trim()){ setRunStatus("답안 코드가 비어 있어요.", true); return; }
  let entry = "main.py";
  if(cmd==="run" && !files["main.py"]){ entry = names.find(n=>n.endsWith(".py") && !/(^|\/)test_|_test\.py$/.test(n)); if(!entry){ setRunStatus("실행할 .py 파일이 없어요.", true); return; } }
  if(cmd==="test" && !names.some(n=>/(^|\/)test_[^\/]*\.py$|_test\.py$/.test(n))){ setRunStatus("test_로 시작하는 파일이 없어요. # --- test_main.py --- 로 테스트 파일을 만들어 주세요.", true); return; }
  S.runs++;
  appendRun(`${S.run.trim()?"\n":""}$ ${cmd==="test"?"pytest -q":"python "+entry}   (${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})})\n`);
  setRunBusy(true); setRunStatus("준비 중이에요.");
  try{
    const w = getWorker();
    bootTimer = setTimeout(()=>{ killWorker(); setRunStatus("실행 환경을 불러오지 못했어요(시간 초과). 인터넷 연결을 확인하고 다시 눌러 주세요.", true); setRunBusy(false); }, BOOT_LIMIT_MS);
    w.postMessage({ type:"run", cmd, files, entry });
  }catch(e){
    killWorker(); setRunStatus("이 화면에서 파이썬을 띄우지 못했어요. 내 PC에서 돌린 뒤 결과를 붙여 넣어 주세요.", true); setRunBusy(false);
  }
}

  try{
    const r = await sampleFn(turns, { cache:false, signal:chatCtl.signal, modelTier:LEVELS[S.aiLevel].tier,
      onText:({text})=>{ aiMsg.content=text; aiEl.innerHTML=renderBody(text, S.chat.length-1); scrollMsgs(); } });
    aiMsg.content = r.text;
    if(r.modelTierApplied && r.modelTierApplied!==LEVELS[S.aiLevel].tier) st.textContent="요금제 사정으로 다른 성능의 모델이 대신 답했어요.";
    S.usage.calls++; S.usage.inChars+=inChars; S.usage.outChars+=r.text.length;
    if(r.usage){ S.usage.realIn=(S.usage.realIn||0)+r.usage.input; S.usage.realOut=(S.usage.realOut||0)+r.usage.output; }
    if(r.truncated) st.textContent="답이 길어서 중간에 끊겼어요. 더 작은 단위로 물어보세요.";
  }catch(e){
    S.usage.calls++; S.usage.inChars+=inChars; S.usage.outChars+=(e&&e.text||"").length;
    if(e && e.usage){ S.usage.realIn=(S.usage.realIn||0)+e.usage.input; S.usage.realOut=(S.usage.realOut||0)+e.usage.output; }
    aiMsg.content = (e && e.text) ? e.text + "\n\n(답이 중간에 멈췄어요)" : "";
    if(!aiMsg.content){ S.chat.pop(); }
    st.className="status err"; st.textContent = sampleErr(e, "AI 답을 받지 못했어요. 다시 보내 보세요.");
  }finally{
    chatBusy=false;
    const m=document.getElementById("msgs");
    if(m){ m.innerHTML = S.chat.map((x,i)=>msgHtml(x,i)).join(""); scrollMsgs(); }
    const s2=document.getElementById("send"), p2=document.getElementById("stopChat");
    if(s2) s2.disabled=false; if(p2) p2.hidden=true;
    updateMeter(); saveDraft();
  }
}
function sampleErr(e, fallback){
  const c = e && e.code;
  if(c==="not_granted"||c==="sampling_disabled") return "AI 사용이 허용되지 않았어요. 내 도구 모드와 직접 채점은 그대로 쓸 수 있어요.";
  if(c==="rate_limited") return "AI 사용량이 잠시 막혔어요. 몇 분 뒤 다시 해 주세요.";
  if(c==="session_expired") return "로그인이 만료됐어요. 다시 로그인한 뒤 해 주세요.";
  if(c==="cancelled") return "멈췄어요.";
  if(c==="no_key") return "AI를 쓰려면 시작 화면 맨 위에 Claude API 키를 넣어 주세요.";
  if(c==="bad_key") return "API 키가 맞지 않아요. 시작 화면에서 키를 다시 넣어 주세요.";
  if(c==="network") return "Claude API에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
  if(c==="bad_request") return "요청이 거절됐어요" + (e.message ? ": " + e.message : ".");
  return fallback;
}

/* ───────── Claude API (웹사이트 버전 전용) ─────────
   API 키는 이 브라우저의 localStorage에만 저장해요. 코드·저장소에는 들어가지 않고,
   api.anthropic.com 호출에만 써요. */
const KEY_STORE = "vibe-mock-anthropic-key";
const MODELS = { complex:"claude-opus-5-5", default:"claude-sonnet-5-5", quick:"claude-haiku-5-5" };  // AI 성능 상·중·하
const MAX_TOKENS = 8000;   // 한 번 답할 때 최대 출력 토큰. 작으면 긴 코드가 잘리고, 크면 답이 길어질 때 요금이 늘어요
function getKey(){ try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; } }
function setKey(k){ try{ if(k) localStorage.setItem(KEY_STORE, k); else localStorage.removeItem(KEY_STORE); }catch(e){} }

// 같은 역할이 연달아 오면 하나로 합침 (첫 지시문 + 첫 질문처럼)
function toMessages(input){
  const turns = typeof input === "string" ? [{ role:"user", content:input }] : input;
  const out = [];
  for(const t of turns){
    if(out.length && out[out.length-1].role === t.role) out[out.length-1].content += "\n\n" + t.content;
    else out.push({ role:t.role, content:t.content });
  }
  return out;
}

async function callClaude(input, opts = {}){
  const key = getKey();
  if(!key) throw { code:"no_key" };
  const tier = opts.modelTier || "default";
  const body = { model: MODELS[tier] || MODELS.default, max_tokens: MAX_TOKENS, stream: true, messages: toMessages(input) };
  let res;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: opts.signal,
      headers: { "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01",
                 "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify(body),
    });
  }catch(e){
    throw { code: e && e.name === "AbortError" ? "cancelled" : "network" };
  }
  if(!res.ok){
    let message = "";
    try{ message = (await res.json()).error?.message || ""; }catch(e){}
    const code = (res.status === 401 || res.status === 403) ? "bad_key"
      : res.status === 429 ? "rate_limited" : res.status === 400 ? "bad_request" : "upstream_error";
    throw { code, message, status: res.status };
  }
  // 스트리밍 응답(SSE)을 읽으며 글자가 나오는 대로 화면에 보여 줌
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stop = null;
  const usage = { input:0, output:0 };
  try{
    for(;;){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data:"));
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(5)); }catch(e){ continue; }
        if(ev.type === "message_start") usage.input = ev.message?.usage?.input_tokens || 0;
        else if(ev.type === "content_block_delta" && ev.delta?.type === "text_delta"){
          text += ev.delta.text;
          if(opts.onText) opts.onText({ text, delta: ev.delta.text });
        }
        else if(ev.type === "message_delta"){
          if(ev.usage?.output_tokens != null) usage.output = ev.usage.output_tokens;
          if(ev.delta?.stop_reason) stop = ev.delta.stop_reason;
        }
        else if(ev.type === "error") throw { code:"upstream_error", message: ev.error?.message, text, usage };
      }
    }
  }catch(e){
    if(e && e.name === "AbortError") throw { code:"cancelled", text, usage };
    if(e && e.code) throw e;
    throw { code:"upstream_error", text, usage };
  }
  if(!text.trim()) throw { code:"empty_completion", usage };
  return { text, truncated: stop === "max_tokens", modelTierApplied: tier, usage };
}

function parseJsonLoose(t){
  try{ return JSON.parse(t); }catch(e){}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
  const starts = ["{","["].map(c => t.indexOf(c)).filter(i => i >= 0);
  const a = starts.length ? Math.min(...starts) : -1, b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if(a >= 0 && a < b){ try{ return JSON.parse(t.slice(a, b + 1)); }catch(e){} }
  throw { code:"invalid_json", text:t };
}

// 아티팩트 버전의 claude.use("sample")과 같은 모양으로 맞춘 함수
function makeSample(){
  const f = (input, opts = {}) => callClaude(input, opts);
  f.json = async (input, opts = {}) => {
    const r = await callClaude(typeof input === "string" ? input + "\n\n다른 설명 없이 JSON 값 하나만 답해." : input, opts);
    if(r.truncated) throw { code:"invalid_json", text:r.text };
    return parseJsonLoose(r.text);
  };
  return f;
}

/* ───────── GitHub 비공개 저장소에 보고서·기록 저장 (웹사이트 버전 전용) ─────────
   토큰은 이 브라우저의 localStorage에만 저장해요. api.github.com 호출에만 써요. */
const GH_TOKEN_STORE = "vibe-mock-gh-token";
const GH_REPO_STORE = "vibe-mock-gh-repo";
const GH_INDEX = "records/index.json";   // 기록 목록(최신순). 보고서 본문은 reports/ 아래 .md
const pageOwner = (location.hostname.match(/^([^.]+)\.github\.io$/) || [])[1] || "";
let ghState = { status:"", busy:false, lastRec:null, saved:null };

function ghToken(){ try{ return localStorage.getItem(GH_TOKEN_STORE) || ""; }catch(e){ return ""; } }
function ghRepo(){ try{ return localStorage.getItem(GH_REPO_STORE) || (pageOwner ? pageOwner + "/vibe-mock-records" : ""); }catch(e){ return ""; } }
function ghSet(token, repo){ try{
  if(token) localStorage.setItem(GH_TOKEN_STORE, token); else localStorage.removeItem(GH_TOKEN_STORE);
  if(repo) localStorage.setItem(GH_REPO_STORE, repo); else localStorage.removeItem(GH_REPO_STORE);
}catch(e){} }
const ghReady = () => !!(ghToken() && ghRepo());

async function gh(path, opts = {}){
  const res = await fetch("https://api.github.com" + path, {
    method: opts.method || "GET",
    headers: { "Authorization":"Bearer " + ghToken(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
               ...(opts.body ? { "Content-Type":"application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status === 404 && opts.allow404) return null;
  if(!res.ok){
    let msg = ""; try{ msg = (await res.json()).message || ""; }catch(e){}
    throw { status: res.status, message: msg };
  }
  return res.status === 204 ? null : res.json();
}
// 한글이 깨지지 않게 UTF-8 ↔ base64
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode(...bytes.subarray(i,i+0x8000)); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const ghPathUrl = p => p.split("/").map(encodeURIComponent).join("/");
function ghErr(e){
  if(e && e.status === 401) return "GitHub 토큰이 맞지 않거나 만료됐어요.";
  if(e && e.status === 403) return "토큰에 이 저장소 쓰기 권한이 없어요. Contents: Read and write로 만들었는지 확인해 주세요.";
  if(e && e.status === 404) return "저장소를 찾지 못했어요. 이름과 토큰의 저장소 선택을 확인해 주세요.";
  if(e && e.status === 409) return "다른 기기에서 동시에 저장했어요. 다시 저장을 눌러 주세요.";
  return "GitHub에 연결하지 못했어요" + (e && e.message ? ": " + e.message : ".");
}

async function ghReadIndex(){
  const f = await gh(`/repos/${ghRepo()}/contents/${GH_INDEX}`, { allow404:true });
  return f ? { list: JSON.parse(unb64(f.content)), sha: f.sha } : { list: [], sha: null };
}
async function ghPut(path, text, message, sha){
  return gh(`/repos/${ghRepo()}/contents/${ghPathUrl(path)}`, { method:"PUT", body:{ message, content:b64(text), ...(sha ? { sha } : {}) } });
}
function reportPath(rec){
  const d = new Date(rec.at);
  const pad = n => String(n).padStart(2,"0");
  const day = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const slug = rec.taskTitle.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40);
  return `reports/${day.slice(0,7)}/${day}_${pad(d.getHours())}${pad(d.getMinutes())}_${slug}_${rec.total}점.md`;
}
async function ghSaveRecord(rec, md){
  const path = rec.report || reportPath(rec);
  const existing = await gh(`/repos/${ghRepo()}/contents/${ghPathUrl(path)}`, { allow404:true });
  await ghPut(path, md, `보고서: ${rec.taskTitle} ${rec.total}점`, existing && existing.sha);
  const entry = { ...rec, report: path };
  for(let attempt = 0; attempt < 2; attempt++){   // 목록 파일이 그사이 바뀌었으면 한 번만 다시 시도
    const idx = await ghReadIndex();
    const list = [entry, ...idx.list.filter(x => x.id !== rec.id)].slice(0, 1000);
    try{ await ghPut(GH_INDEX, JSON.stringify(list, null, 1), `기록: ${rec.taskTitle} ${rec.total}점`, idx.sha); return list; }
    catch(e){ if(e.status !== 409 && e.status !== 422 || attempt) throw e; }
  }
}
function siteReportUrl(path){ return `https://github.com/${ghRepo()}/blob/main/${ghPathUrl(path)}`; }
function siteHistoryNote(){ return ghReady() ? `기록과 보고서는 GitHub 저장소 ${esc(ghRepo())}에 저장돼요. 제목을 누르면 보고서가 열려요.` : "기록은 이 브라우저에만 저장돼요. 시작 화면에서 GitHub 저장소를 연결하면 어느 기기에서든 남아요."; }
async function ghLoadHistory(){
  if(!ghReady()) return;
  try{ const idx = await ghReadIndex(); history = idx.list; if(S.view === "setup") render(); }
  catch(e){ ghState.status = ghErr(e); if(S.view === "setup") render(); }
}

function downloadReport(){
  const rec = ghState.lastRec || S.lastRec; if(!rec) return;
  const md = buildReport(rec);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type:"text/markdown;charset=utf-8" }));
  a.download = (rec.report || reportPath(rec)).split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function siteAfterFinish(rec){
  ghState.lastRec = rec; ghState.saved = null; S.lastRec = rec; saveDraft();
  if(!ghReady()){ setResultStatus("GitHub 저장소를 연결하지 않아 이 브라우저에만 저장했어요. 보고서는 내려받을 수 있어요."); return; }
  await saveToGitHub();
}
async function saveToGitHub(){
  const rec = ghState.lastRec || S.lastRec; if(!rec || ghState.busy) return;
  ghState.busy = true; setResultStatus("GitHub 저장소에 보고서를 저장하는 중이에요.");
  try{
    rec.report = rec.report || reportPath(rec);
    const list = await ghSaveRecord(rec, buildReport(rec));
    history = list; ghState.saved = rec.report; saveDraft();
    setResultStatus("GitHub 저장소에 보고서를 저장했어요.");
  }catch(e){ ghState.saved = null; setResultStatus(ghErr(e) + " 결과는 이 브라우저에 남아 있어요.", true); }
  finally{ ghState.busy = false; }
}
function setResultStatus(t, err){
  ghState.status = t; ghState.err = !!err;
  const box = document.getElementById("reportBox"); if(box) box.outerHTML = siteResultActions();
}
function siteResultActions(){
  if(S.view !== "result") return "";
  const link = ghState.saved ? `<a href="${esc(siteReportUrl(ghState.saved))}" target="_blank" rel="noopener">GitHub에서 보고서 열기</a>` : "";
  return `<div class="block" id="reportBox"><h3>보고서</h3>
    <p class="status${ghState.err?" err":""}">${esc(ghState.status||"")}</p>
    <div class="actions"><button class="btn ghost sm" id="repDown">보고서 내려받기 (.md)</button>
    ${ghReady() && !ghState.saved ? `<button class="btn ghost sm" id="repSave">GitHub에 저장</button>` : ""}${link}</div></div>`;
}
function ghSettings(){
  const st = ghState.status && S.view === "setup" ? `<p class="status err">${esc(ghState.status)}</p>` : "";
  if(ghReady()) return `<section class="section"><h2>기록 저장소</h2>
    <p class="small">기록과 보고서를 GitHub 저장소 <b>${esc(ghRepo())}</b>에 저장해요.</p>
    <div class="actions"><button class="btn ghost sm" id="ghTest">연결 확인</button><button class="btn ghost sm" id="ghDel">연결 해제</button></div>
    <p class="status" id="ghStatus"></p>${st}</section>`;
  return `<section class="section"><h2>기록 저장소</h2>
    <p class="small">GitHub 비공개 저장소와 그 저장소만 쓸 수 있는 토큰(Contents: Read and write)을 넣으면, 기록과 보고서가 어느 기기에서든 남아요. 토큰은 이 브라우저에만 저장돼요.</p>
    <div class="field"><label for="ghRepoIn">저장소 (아이디/이름)</label><input id="ghRepoIn" type="text" autocomplete="off" spellcheck="false" value="${esc(ghRepo())}" placeholder="아이디/vibe-mock-records"></div>
    <div class="field"><label for="ghTokIn">토큰</label><input id="ghTokIn" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_..."></div>
    <div class="actions"><button class="btn sm" id="ghSave">연결</button></div>
    <p class="status" id="ghStatus"></p></section>`;
}
async function ghClick(b){
  const st = document.getElementById("ghStatus");
  if(b.id === "ghSave"){
    const repo = (document.getElementById("ghRepoIn").value || "").trim().replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "");
    const tok = (document.getElementById("ghTokIn").value || "").trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ st.className = "status err"; st.textContent = "저장소는 아이디/이름 모양으로 넣어 주세요."; return; }
    if(!tok){ st.className = "status err"; st.textContent = "토큰을 넣어 주세요."; return; }
    ghSet(tok, repo); st.className = "status"; st.textContent = "확인 중이에요."; b.disabled = true;
    try{
      const r = await gh(`/repos/${repo}`);
      if(r && r.permissions && r.permissions.push === false) throw { status:403 };
      ghState.status = ""; await ghLoadHistory(); render();
      const s2 = document.getElementById("ghStatus"); if(s2) s2.textContent = r.private ? "연결됐어요." : "연결됐어요. 다만 이 저장소는 공개 저장소라 보고서가 누구에게나 보여요.";
    }catch(e){ ghSet("", repo); st.className = "status err"; st.textContent = ghErr(e); b.disabled = false; }
    return;
  }
  if(b.id === "ghDel"){ ghSet("", ghRepo()); history = readLocalHist(); render(); return; }
  if(b.id === "ghTest"){
    st.className = "status"; st.textContent = "확인 중이에요.";
    try{ const r = await gh(`/repos/${ghRepo()}`); st.textContent = r.private ? "연결됐어요." : "연결됐어요(공개 저장소)."; }
    catch(e){ st.className = "status err"; st.textContent = ghErr(e); }
    return;
  }
  if(b.id === "repDown"){ downloadReport(); return; }
  if(b.id === "repSave"){ saveToGitHub(); return; }
}

/* ───────── 시작 ───────── */
history = readLocalHist();
sampleFn = getKey() ? makeSample() : null;
if(!sampleFn && S.env === "builtin") S.env = "own";
render();
ghLoadHistory();
})();
</script>

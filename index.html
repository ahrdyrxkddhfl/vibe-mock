function updateClock(){
  const el = document.getElementById("clock"); if(!el) return;
  const e = elapsed(), left = limitMs()-e, ratio = Math.min(1, e/limitMs());
  el.textContent = left>=0 ? fmt(left) : "+"+fmt(-left);
  el.classList.toggle("low", left < 10*60000);
  let start = 0;
  PHASES.forEach((p,i)=>{ const ph=document.getElementById("ph"+i); if(!ph) return;
    ph.querySelector("i").style.width = (Math.max(0,Math.min(1,(ratio-start)/(p.until-start)))*100)+"%"; start=p.until; });
  const cur = PHASES.find(p=>ratio < p.until) || PHASES[PHASES.length-1];
  const pn = document.getElementById("phaseNow");
  if(pn){
    const txt = !S.startedAt ? `<b>준비</b><span class="muted">시험 안내를 읽고 시작하세요.</span>`
      : S.pausedAt ? `<b>일시정지</b><span class="muted">실제 시험에선 멈출 수 없어요.</span>`
      : left < 0 ? `<b>시간 초과</b><span class="muted">실제 시험이라면 지금 제출해야 해요.</span>`
      : `<b>${esc(cur.name)}</b><span class="muted">${esc(cur.hint)}</span>`;
    if(pn.dataset.v !== txt){ pn.innerHTML = txt; pn.dataset.v = txt; }
  }
  updateMeter();
}

/* 칸 너비·콘솔 높이 끌어서 조절 (단위: 화면 너비·코드 칸 높이의 %) */
const PANE_MIN = 12;        // 문제·AI 칸의 최소 너비. 작으면 칸을 거의 접을 수 있고, 크면 좁은 화면에서 가운데가 눌려요
const PANE_MAX = 65;        // 문제·AI 칸의 최대 너비
const CODE_MIN = 20;        // 가운데 코드 칸이 최소로 남길 너비
const CONSOLE_RANGE = [10, 85];  // 실행 결과 칸 높이 범위
const LAYOUT_DEFAULT = { w1:30, w3:30, hc:34 };
const AI_INPUT = { def:88, min:56, maxRatio:0.75 };  // AI 입력칸 높이(px): 기본·최소, 최대는 채팅 칸 높이에 대한 비율
function bindResizers(){
  const main = document.getElementById("ideMain"); if(!main) return;
  main.querySelectorAll("[data-gutter]").forEach(g => {
    g.addEventListener("pointerdown", ev => {
      ev.preventDefault(); g.setPointerCapture(ev.pointerId); g.classList.add("drag");
      const rect = main.getBoundingClientRect();
      const move = e => {
        const x = (e.clientX - rect.left) / rect.width * 100;
        S.layout = S.layout || {};
        const w1 = S.layout.w1 || LAYOUT_DEFAULT.w1, w3 = S.layout.w3 || LAYOUT_DEFAULT.w3;
        if(g.dataset.gutter === "1") S.layout.w1 = Math.max(PANE_MIN, Math.min(PANE_MAX, 100 - w3 - CODE_MIN, x));
        else S.layout.w3 = Math.max(PANE_MIN, Math.min(PANE_MAX, 100 - w1 - CODE_MIN, 100 - x));
        main.style.setProperty("--w1", (S.layout.w1||LAYOUT_DEFAULT.w1) + "%"); main.style.setProperty("--w3", (S.layout.w3||LAYOUT_DEFAULT.w3) + "%");
        if(cm) cm.refresh();
      };
      const up = () => { g.classList.remove("drag"); g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); saveDraft(); };
      g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
    });
    g.addEventListener("dblclick", () => {
      S.layout = S.layout || {};
      S.layout[g.dataset.gutter === "1" ? "w1" : "w3"] = LAYOUT_DEFAULT[g.dataset.gutter === "1" ? "w1" : "w3"];
      main.style.setProperty("--w1", (S.layout.w1||LAYOUT_DEFAULT.w1) + "%"); main.style.setProperty("--w3", (S.layout.w3||LAYOUT_DEFAULT.w3) + "%");
      if(cm) cm.refresh(); saveDraft();
    });
  });
  const hg = document.getElementById("hgutter"), pc = main.querySelector(".p-code");
  if(hg && pc) hg.addEventListener("pointerdown", ev => {
    ev.preventDefault(); hg.setPointerCapture(ev.pointerId); hg.classList.add("drag");
    const rect = pc.getBoundingClientRect();
    const move = e => { S.layout = S.layout || {}; S.layout.hc = Math.max(CONSOLE_RANGE[0], Math.min(CONSOLE_RANGE[1], (rect.bottom - e.clientY) / rect.height * 100)); pc.style.setProperty("--hc", S.layout.hc + "%"); if(cm) cm.refresh(); };
    const up = () => { hg.classList.remove("drag"); hg.removeEventListener("pointermove", move); hg.removeEventListener("pointerup", up); saveDraft(); };
    hg.addEventListener("pointermove", move); hg.addEventListener("pointerup", up);
  });
  const ag = document.getElementById("agutter"), ask = document.getElementById("ask"), chat = main.querySelector(".chat");
  if(ag && ask && chat){
    ag.addEventListener("pointerdown", ev => {
      ev.preventDefault(); ag.setPointerCapture(ev.pointerId); ag.classList.add("drag");
      const y0 = ev.clientY, h0 = ask.offsetHeight || AI_INPUT.def, max = Math.max(AI_INPUT.min, chat.clientHeight * AI_INPUT.maxRatio);
      const move = e => { S.layout = S.layout || {}; S.layout.ah = Math.round(Math.max(AI_INPUT.min, Math.min(max, h0 + (y0 - e.clientY)))); ask.style.height = S.layout.ah + "px"; };
      const up = () => { ag.classList.remove("drag"); ag.removeEventListener("pointermove", move); ag.removeEventListener("pointerup", up); saveDraft(); };
      ag.addEventListener("pointermove", move); ag.addEventListener("pointerup", up);
    });
    ag.addEventListener("dblclick", () => { S.layout = S.layout || {}; S.layout.ah = AI_INPUT.def; ask.style.height = AI_INPUT.def + "px"; saveDraft(); });
  }
  if(hg && pc) hg.addEventListener("dblclick", () => {
    S.layout = S.layout || {}; S.layout.hc = LAYOUT_DEFAULT.hc; pc.style.setProperty("--hc", S.layout.hc + "%"); if(cm) cm.refresh(); saveDraft();
  });
}

/* ───────── 화면 안 파이썬 실행 ───────── */
let worker = null, runBusy = false, runStatusText = "", runTimer = null, bootTimer = null;
const RUN_LIMIT_MS = 30000;    // 한 번 실행이 이보다 길면 무한 루프로 보고 멈춤
const BOOT_LIMIT_MS = 180000;  // 첫 로딩(약 10~40MB 다운로드)을 기다리는 최대 시간
function parseFiles(code){
  const re = /^#\s*---\s*([\w.\-\/]+)\s*---\s*$/gm;
  const marks = [...code.matchAll(re)];
  if(!marks.length) return { "main.py": code };
  const files = {};
  marks.forEach((m,i)=>{
    const start = m.index + m[0].length + 1, end = i+1<marks.length ? marks[i+1].index : code.length;
    const name = m[1].replace(/^\/+/,"").replace(/\.\.+/g,".");
    files[name] = code.slice(start, end).replace(/\s+$/,"") + "\n";
  });
  return files;
}
function setRunStatus(t, err){ runStatusText=t; const el=document.getElementById("runStatus"); if(el){ el.textContent=t; el.className="console-status"+(err?" err":""); } }
function setRunBusy(b){ runBusy=b; const a=document.getElementById("runMain"), t=document.getElementById("runTest"), s=document.getElementById("runStop");
  if(a) a.disabled=b; if(t) t.disabled=b; if(s) s.hidden=!b; }
function appendRun(text){ S.run += text; const el=document.getElementById("run"); if(el){ el.value=S.run; el.scrollTop=el.scrollHeight; } saveDraft(); }
function killWorker(){ if(worker){ worker.terminate(); worker=null; } clearTimeout(runTimer); clearTimeout(bootTimer); }
let hiddenWait = null;   // 숨은 테스트를 기다리는 중이면 {resolve, onStatus}
function finishHidden(val){ const w=hiddenWait; hiddenWait=null; clearTimeout(runTimer); clearTimeout(bootTimer); setRunBusy(false); if(w) w.resolve(val); }
function getWorker(){
  if(worker) return worker;
  worker = new Worker("py-worker.js");
  worker.onmessage = ev => {
    const m = ev.data || {};
    if(hiddenWait){
      if(m.type==="status") hiddenWait.onStatus(m.text);
      else if(m.type==="started"){ clearTimeout(bootTimer); runTimer=setTimeout(()=>{ killWorker(); finishHidden({error:"숨은 테스트가 60초 안에 끝나지 않았어요. 무한 루프가 있는지 확인해 보세요."}); }, 60000); }
      else if(m.type==="hidden") finishHidden({rows:m.rows});
      else if(m.type==="fail"){ killWorker(); finishHidden({error:m.text}); }
      return;
    }
    if(m.type==="status") setRunStatus(m.text);
    else if(m.type==="started"){ clearTimeout(bootTimer); runTimer=setTimeout(()=>{ killWorker(); appendRun(`\n[시간 초과: ${RUN_LIMIT_MS/1000}초 넘게 실행돼서 멈췄어요. 무한 루프인지 확인해 보세요]\n`); setRunStatus("시간 초과로 멈췄어요. 다음 실행 땐 환경을 다시 불러와요.", true); setRunBusy(false); }, RUN_LIMIT_MS); }
    else if(m.type==="out") appendRun(m.chunks.map(c=>c.text).join(""));
    else if(m.type==="done"){ clearTimeout(runTimer); appendRun(`\n[종료 코드 ${m.code} · ${m.ms}ms]\n`); setRunStatus(m.code===0?"끝났어요.":"오류나 실패가 있어요. 출력을 확인하세요.", m.code!==0); setRunBusy(false); }
    else if(m.type==="fail"){ killWorker(); appendRun(`\n[실행 환경 오류] ${m.text}\n`); setRunStatus("실행 환경에서 오류가 났어요. 다시 눌러 보고, 계속되면 내 PC에서 돌려 결과를 붙여 넣어 주세요.", true); setRunBusy(false); }
  };
  worker.onerror = e => {
    e.preventDefault && e.preventDefault(); killWorker();
    if(hiddenWait){ finishHidden({error:"이 화면에서 파이썬을 띄우지 못했어요."}); return; }
    setRunStatus("이 화면에서 파이썬을 띄우지 못했어요. 내 PC에서 돌린 뒤 결과를 붙여 넣어 주세요.", true); setRunBusy(false);
  };
  return worker;
}
/* 제출할 때 숨은 테스트를 돌려 {rows} 또는 {error}를 돌려줌 */
function runHidden(onStatus){
  return new Promise(resolve => {
    if(runBusy){ killWorker(); setRunBusy(false); }
    const T = S.task;
    const code = hiddenCode(T.type==="lib" ? "prelude-lib" : "prelude") + "\n" + (T.hiddenCode || hiddenCode(T.id));
    hiddenWait = { resolve, onStatus: onStatus || (()=>{}) };
    setRunBusy(true);
    try{
      const w = getWorker();
      bootTimer = setTimeout(()=>{ killWorker(); finishHidden({error:"실행 환경을 불러오지 못했어요(시간 초과)."}); }, BOOT_LIMIT_MS);
      w.postMessage({ type:"run", cmd:"hidden", files:Object.assign(parseFiles(S.code), libFilesOf(T)), hidden:code });
    }catch(e){ killWorker(); finishHidden({error:"이 화면에서 파이썬을 띄우지 못했어요."}); }
  });
}
function summarizeHidden(res){
  if(!res || res.error) return { error: res ? res.error : "숨은 테스트를 돌리지 못했어요." };
  const docs = {};
  const src = (S.task.hiddenCode || hiddenCode(S.task.id));
  for(const m of src.matchAll(/def (test_\w+)\([^)]*\):\s*\n\s*"""([^"]+)"""/g)) docs[m[1]] = m[2].trim();
  const rows = res.rows.filter(r=>r.name.startsWith("test_")).map(r=>({ name:r.name, desc:docs[r.name]||r.name, ok:r.outcome==="passed", msg:r.msg }));
  const broken = res.rows.find(r=>!r.name.startsWith("test_"));
  if(!rows.length) return { error: broken ? "테스트를 시작하지 못했어요: " + broken.msg.split("\n").filter(Boolean).slice(-1)[0] : "실행된 테스트가 없어요." };
  return { rows, passed: rows.filter(r=>r.ok).length, total: rows.length };
}
// 라이브러리형의 '테스트': 문제 예제와 '테스트 케이스' 칸에 내가 넣은 케이스를 한 파일로 묶어 실행
function examplesScript(T){
  const libs = Object.keys(libFilesOf(T)).map(n => n.replace(/\.py$/, ""));
  const exEl = document.getElementById("ex-" + T.id);
  const cases = (S.userCases || []).filter(c => c.expr.trim() && c.want.trim()).map(c => [c.expr, c.want]);
  return document.getElementById("ex-runner").textContent + "\n" + (exEl ? exEl.textContent : "CASES = []\n") + `
import importlib as _il, json as _json
_ns = {}
for _m in ["solution"] + ${JSON.stringify(libs)}:
    _ns.update({k: v for k, v in vars(_il.import_module(_m)).items() if not k.startswith("__")})
def _mk(code, want):
    def f():
        ns = dict(_ns)
        lines = code.strip().split("\\n")
        if len(lines) > 1:
            exec("\\n".join(lines[:-1]), ns)
        return eval(lines[-1], ns), eval(want, ns)
    return f
CASES = list(CASES) + [("내 케이스 " + str(i + 1) + " · " + c.strip().split("\\n")[-1], _mk(c, w)) for i, (c, w) in enumerate(_json.loads(${JSON.stringify(JSON.stringify(cases))}))]
if not CASES:
    print("돌릴 예제가 없어요. '테스트 케이스' 칸에 케이스를 추가해 보세요.")
else:
    _run(CASES)
`;
}
function runCode(cmd){
  if(runBusy) return;
  if(!S.startedAt){ setRunStatus("시작을 누른 뒤 실행할 수 있어요.", true); return; }
  const files = parseFiles(S.code);
  const names = Object.keys(files);
  if(!S.code.trim()){ setRunStatus("답안 코드가 비어 있어요.", true); return; }
  let entry = "main.py";
  if(cmd==="run" && !files["main.py"] && files["solution.py"]) entry = "solution.py";
  else if(cmd==="run" && !files["main.py"]){ entry = names.find(n=>n.endsWith(".py") && !/(^|\/)test_|_test\.py$/.test(n)); if(!entry){ setRunStatus("실행할 .py 파일이 없어요.", true); return; } }
  if(cmd==="test" && S.task && S.task.type==="lib"){
    S.runs++;
    const nUser = (S.userCases || []).filter(c => c.expr.trim() && c.want.trim()).length;
    appendRun(`${S.run.trim()?"\n":""}$ 테스트: 예제${nUser ? ` + 내 케이스 ${nUser}개` : ""}   (${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})})\n`);
    setCtab("run"); setRunBusy(true); setRunStatus("준비 중이에요.");
    try{
      const w = getWorker();
      bootTimer = setTimeout(()=>{ killWorker(); setRunStatus("실행 환경을 불러오지 못했어요(시간 초과). 인터넷 연결을 확인하고 다시 눌러 주세요.", true); setRunBusy(false); }, BOOT_LIMIT_MS);
      w.postMessage({ type:"run", cmd:"run", files:Object.assign(files, libFilesOf(S.task), { "_examples.py": examplesScript(S.task) }), entry:"_examples.py" });
    }catch(e){ killWorker(); setRunStatus("이 화면에서 파이썬을 띄우지 못했어요.", true); setRunBusy(false); }
    return;
  }
  if(cmd==="test" && !names.some(n=>/(^|\/)test_[^\/]*\.py$|_test\.py$/.test(n))){ setRunStatus("test_로 시작하는 파일이 없어요. 파일 탭 옆 +를 눌러 test_solution.py 같은 테스트 파일을 만들어 주세요.", true); return; }
  S.runs++;
  appendRun(`${S.run.trim()?"\n":""}$ ${cmd==="test"?"pytest -q":"python "+entry}   (${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})})\n`);
  setRunBusy(true); setRunStatus("준비 중이에요.");
  try{
    const w = getWorker();
    bootTimer = setTimeout(()=>{ killWorker(); setRunStatus("실행 환경을 불러오지 못했어요(시간 초과). 인터넷 연결을 확인하고 다시 눌러 주세요.", true); setRunBusy(false); }, BOOT_LIMIT_MS);
    w.postMessage({ type:"run", cmd, files, entry });
  }catch(e){
    killWorker(); setRunStatus("이 화면에서 파이썬을 띄우지 못했어요. 내 PC에서 돌린 뒤 결과를 붙여 넣어 주세요.", true); setRunBusy(false);
  }
}

/* ───────── 시험장 AI ───────── */
function chatPreamble(){
  const T=S.task;
  return `너는 코딩 테스트 플랫폼 화면에 들어 있는 AI 코딩 어시스턴트야. 응시자는 신입 채용 '바이브 코딩 테스트'를 보는 중이고 제한 시간은 ${S.minutes}분이야.
너는 문제지를 볼 수 없어. 응시자가 대화로 알려 준 내용만 알고 있어.
응시자가 요청한 일을 도와. 요청하지 않은 기능을 덧붙이지 말고, 모르는 것은 추측하지 말고 물어봐. 코드는 \`\`\` 코드 블록으로 줘. 설명은 쉬운 한국어로 짧게.
실행 환경: 브라우저 안 파이썬 3.13. fastapi, pydantic, httpx, pytest, numpy, pandas, sqlite3, scikit-learn을 쓸 수 있고 uvicorn·네트워크·pip 설치는 없어. FastAPI 확인은 fastapi.testclient.TestClient로 해.${S.aiLevel==="low"?LOW_AI_RULES:""}`;
}
// 실전 규칙일 때 입력칸 아래에 '이번 질문 / 남은 토큰 / 남은 질문'을 보여 주고, 넘으면 보내기를 막음
function updateSendMeter(){
  const el = document.getElementById("sendMeter"); if(!el) return;
  const box = document.getElementById("ask"), send = document.getElementById("send");
  const now = estTok(box ? box.value.trim() : ""), left = SEND_LIMIT - sentTok(), qLeft = Q_LIMIT - prompts();
  const over = now > left, out = qLeft <= 0 || left <= 0;
  el.className = "small" + (over || out ? " warn-text" : "");
  el.textContent = out ? `이 문제의 AI 사용 한도를 다 썼어요 (질문 ${prompts()}/${Q_LIMIT} · 토큰 약 ${sentTok()}/${SEND_LIMIT})`
    : `이번 질문 약 ${now}토큰 · 남은 토큰 약 ${Math.max(0,left)}/${SEND_LIMIT} · 남은 질문 ${qLeft}/${Q_LIMIT}${over ? " · 한도를 넘어요" : ""}`;
  if(send && S.startedAt && !S.finishedAt && !chatBusy) send.disabled = over || out || !now;
  if(box && out) box.disabled = true;
}
async function sendChat(){
  if(chatBusy) return;
  S.aiLevel = examLevel();   // 풀던 기록이 예전 성능 설정이어도 지금은 시험장 모델로
  const box=document.getElementById("ask"), st=document.getElementById("chatStatus");
  const q = box.value.trim(); if(!q) return;
  if(limited()){
    const left = SEND_LIMIT - sentTok(), need = estTok(q);
    if(prompts() >= Q_LIMIT || need > left){ st.className="status err"; st.textContent = prompts() >= Q_LIMIT ? `질문은 ${Q_LIMIT}번까지예요.` : `이 질문은 약 ${need}토큰이라 남은 ${Math.max(0,left)}토큰을 넘어요. 줄여서 보내 주세요.`; return; }
  }
  const attachedCode = !limited() && S.attach && S.code.trim() ? S.code : "";
  const userMsg = { role:"user", content:q, at:Date.now(), attached: attachedCode ? attachedCode.length : 0, sendTok: estTok(q) };
  S.chat.push(userMsg); box.value=""; saveDraft();
  const aiMsg = { role:"assistant", content:"", at:Date.now() };
  S.chat.push(aiMsg);
  const msgs=document.getElementById("msgs");
  msgs.innerHTML = S.chat.map((m,i)=>msgHtml(m,i)).join("");
  const aiEl = msgs.lastElementChild.querySelector(".body");
  aiEl.innerHTML = `<div class="txt muted">생각하는 중…</div>`; scrollMsgs();

  // 최근 대화 12개까지만 보내고, 첨부 코드는 이번 질문에만 붙임
  const past = S.chat.slice(0,-2).slice(-12).map(m=>({role:m.role, content:m.content||"(빈 답변)"}));
  const lastContent = q + (attachedCode ? `\n\n[현재 답안 코드]\n${attachedCode.slice(0,40000)}` : "");
  const turns = [{role:"user",content:chatPreamble()}, ...past, {role:"user", content:lastContent}];
  const inChars = turns.reduce((a,t)=>a+t.content.length,0);

  chatBusy=true; chatCtl=new AbortController();
  const send=document.getElementById("send"), stop=document.getElementById("stopChat");
  send.disabled=true; stop.hidden=false; st.className="status"; st.textContent="";
  try{
    const r = await sampleFn(turns, { cache:false, signal:chatCtl.signal, modelTier:LEVELS[S.aiLevel].tier,
      onText:({text})=>{ aiMsg.content=text; aiEl.innerHTML=renderBody(text, S.chat.length-1); scrollMsgs(); } });
    aiMsg.content = r.text;
    if(r.modelTierApplied && r.modelTierApplied!==LEVELS[S.aiLevel].tier) st.textContent="고른 모델을 쓸 수 없어 다른 모델이 대신 답했어요.";
    S.usage.calls++; S.usage.inChars+=inChars; S.usage.outChars+=r.text.length;
    if(r.usage){ S.usage.realIn=(S.usage.realIn||0)+r.usage.input; S.usage.realOut=(S.usage.realOut||0)+r.usage.output; }
    aiMsg.tok = r.usage ? { in:r.usage.input, out:r.usage.output, real:true }
      : { in:Math.round(inChars/CHARS_PER_TOKEN), out:Math.round(r.text.length/CHARS_PER_TOKEN), real:false };
    if(r.truncated) st.textContent="답이 길어서 중간에 끊겼어요. 더 작은 단위로 물어보세요.";
  }catch(e){
    S.usage.calls++; S.usage.inChars+=inChars; S.usage.outChars+=(e&&e.text||"").length;
    if(e && e.usage){ S.usage.realIn=(S.usage.realIn||0)+e.usage.input; S.usage.realOut=(S.usage.realOut||0)+e.usage.output; }
    aiMsg.content = (e && e.text) ? e.text + "\n\n(답이 중간에 멈췄어요)" : "";
    if(aiMsg.content) aiMsg.tok = e.usage ? { in:e.usage.input, out:e.usage.output, real:true }
      : { in:Math.round(inChars/CHARS_PER_TOKEN), out:Math.round((e.text||"").length/CHARS_PER_TOKEN), real:false };
    if(!aiMsg.content){ S.chat.pop(); }
    st.className="status err"; st.textContent = sampleErr(e, "AI 답을 받지 못했어요. 다시 보내 보세요.");
  }finally{
    chatBusy=false;
    const m=document.getElementById("msgs");
    if(m){ m.innerHTML = S.chat.map((x,i)=>msgHtml(x,i)).join(""); scrollMsgs(); }
    const s2=document.getElementById("send"), p2=document.getElementById("stopChat");
    if(s2) s2.disabled=false; if(p2) p2.hidden=true;
    updateMeter(); updateSendMeter(); saveDraft();
  }
}
function sampleErr(e, fallback){
  const c = e && e.code;
  if(c==="not_granted"||c==="sampling_disabled") return "AI 사용이 허용되지 않았어요. 내 도구 모드와 직접 채점은 그대로 쓸 수 있어요.";
  if(c==="rate_limited") return "AI 사용량이 잠시 막혔어요. 몇 분 뒤 다시 해 주세요.";
  if(c==="session_expired") return "로그인이 만료됐어요. 다시 로그인한 뒤 해 주세요.";
  if(c==="cancelled") return "멈췄어요.";
  if(c==="no_key") return "AI를 쓰려면 홈의 설정에서 Claude API 키를 넣어 주세요.";
  if(c==="bad_key") return "API 키가 맞지 않아요. 홈의 설정에서 키를 다시 넣어 주세요.";
  if(c==="network") return "Claude API에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";
  if(c==="bad_request") return "요청이 거절됐어요" + (e.message ? ": " + e.message : ".") + (/credit|balance/i.test(e.message||"") ? " (Anthropic 콘솔 Billing에서 크레딧을 충전해야 해요.)" : "");
  if(c==="invalid_json") return e.truncated ? "AI 답이 너무 길어 중간에 잘렸어요. 다시 눌러 주세요." : "AI 답이 정해진 형식(JSON)에 맞지 않았어요. 다시 눌러 주세요.";
  if(c==="empty_completion") return "AI가 빈 답을 보냈어요. 다시 눌러 주세요.";
  if(c==="upstream_error"){
    const st = e.status, m = e.message || "";
    if(st===404) return `모델(${e.model||"?"})을 찾지 못했어요` + (m ? ": " + m : ".");
    if(st===529 || /overload/i.test(m + (e.errType||""))) return "Claude 서버가 붐벼요. 잠시 뒤 다시 눌러 주세요.";
    if(st || m) return `Claude API 오류${st ? " " + st : ""}${m ? ": " + m : ""}`;
  }
  return fallback;
}

      return { name:c.name, max:c.max, score, comment };
    });
    const hidden = hasHidden(T) ? [] : T.hidden.map((h,i)=>{ const g=(r.hidden||[])[i]||{}; return { item:h, ok:g.ok===true?true:g.ok===false?false:null, note:String(g.note||"") }; });
    S.result = { mode:"ai", env, total:crit.reduce((a,c)=>a+c.score,0), criteria:crit, hidden, tests:H,
      summary:String(r.summary||""), promptReview:(r.promptReview||[]).map(String).slice(0,3), strengths:(r.strengths||[]).map(String).slice(0,3),
      fixes:(r.fixes||[]).map(String).slice(0,4), questions:(r.questions||[]).map(String).slice(0,3),
      minutesUsed:used, prompts:prompts(), tokens:tokens(), realTokens:S.usage.realIn!=null, leaves:S.leaves, limit:limited()?"exam":"free", sentTokens:sentTok() };
    finish();
  }catch(e){
    btn.disabled=false; if(selfBtn) selfBtn.disabled=false; stop.hidden=true;
    if(e && e.code==="cancelled"){ stream.hidden=true; st.className="status"; st.textContent="채점을 멈췄어요."; return; }
    st.className="status err"; st.textContent = sampleErr(e, "채점 결과를 읽지 못했어요. 다시 눌러 보거나 직접 채점을 써 주세요.");
  }
}

/* ───────── 보고서 (마크다운) ───────── */
function buildReport(rec){
  const T=S.task, R=S.result;
  const fence = s => "````\n" + String(s||"(없음)").replace(/\s+$/,"") + "\n````";
  const cell = s => String(s||"").replace(/\|/g,"\\|").replace(/\n+/g," ");
  const d = new Date(rec.at);
  const when = d.toLocaleString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const L = [];
  L.push(`# ${T.title} · ${R.total}점`, "");
  L.push(`- 날짜: ${when}`);
  L.push(`- 직무: ${TRACKS[T.track]?.name||""} · 유형: ${typeName(T)} · 출처: ${S.source==="ai"?"AI 출제":"문제은행"}`);
  L.push(`- 환경: ${R.env==="builtin"?`시험장 방식 · ${modelLabel()}`:"내 도구"} · 채점: ${R.mode==="ai"?"AI 채점":"직접 채점"}`);
  L.push(`- 사용 시간: ${R.minutesUsed}분 / ${S.minutes}분`);
  if(R.env==="builtin" && R.limit==="exam") L.push(`- 실전 규칙 · 질문 ${R.prompts}/${Q_LIMIT}회 · 보낸 토큰 약 ${R.sentTokens}/${SEND_LIMIT} · 화면 이탈 ${R.leaves}회`);
  else if(R.env==="builtin") L.push(`- 질문 ${R.prompts}회 · ${R.realTokens?"토큰":"토큰(추정)"} ${R.tokens.toLocaleString()} / 목표 ${tokenTarget().toLocaleString()} · 화면 이탈 ${R.leaves}회`);
  L.push(`- 화면 안 파이썬 실행 ${S.runs}회`, "");
  L.push("## 점수", "", "| 항목 | 점수 | 코멘트 |", "|---|---|---|");
  R.criteria.forEach(c=>L.push(`| ${c.name} | ${c.score}/${c.max} | ${cell(c.comment)} |`));
  L.push(`| **합계** | **${R.total}/100** | |`, "");
  if(R.summary) L.push(`> ${R.summary}`, "");
  if(R.tests){
    if(R.tests.error) L.push("## 숨은 테스트", "", `돌리지 못함: ${R.tests.error}`, "");
    else { L.push(`## 숨은 테스트 ${R.tests.passed}/${R.tests.total}`, ""); R.tests.rows.forEach(r=>L.push(`- ${r.ok?"○":"×"} ${r.desc}${!r.ok&&r.msg?` — ${cell(r.msg.split("\n").filter(Boolean).slice(-1)[0]||"").slice(0,160)}`:""}`)); L.push(""); }
  } else if(R.hidden && R.hidden.length){
    L.push("## 숨은 검증 항목", ""); R.hidden.forEach(h=>L.push(`- ${h.ok===true?"○":h.ok===false?"×":"?"} ${h.item}${h.note?` — ${h.note}`:""}`)); L.push("");
  }
  const sec = (title, arr) => { if(arr && arr.length){ L.push(`## ${title}`, ""); arr.forEach(x=>L.push(`- ${x}`)); L.push(""); } };
  sec("프롬프트 첨삭", R.promptReview); sec("잘한 점", R.strengths); sec("다음에 고칠 점", R.fixes); sec("면접 꼬리질문", R.questions);
  L.push("## 문제", "", T.scenario, "");
  if(T.api) L.push("### API 명세", "", fence(T.api), "");
  if(T.spec) L.push("### 명세", "", fence(T.spec), "");
  L.push("### 필수 요구사항", ""); T.must.forEach((m,i)=>L.push(`- [${S.done[i]?"x":" "}] ${m}`)); L.push("");
  L.push("## 최종 코드", "", fence(S.code), "");
  if(S.readme.trim()) L.push("## README", "", S.readme.trim(), "");
  L.push("## 실행·테스트 결과", "", fence(S.run), "");
  if(R.env==="builtin"){
    L.push("## AI 대화 기록", "");
    S.chat.forEach((m,i)=>{
      const t = m.at ? new Date(m.at).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "";
      L.push(`### #${i} ${m.role==="user"?"나":"AI"} ${t}${m.role==="user"&&m.sendTok!=null?` (보냄 약 ${m.sendTok}토큰)`:""}${m.attached?` (코드 ${m.attached}자 첨부)`:""}${m.tok?` (이번 질문 토큰 ${m.tok.real?"":"약 "}${(m.tok.in+m.tok.out).toLocaleString()} = 보냄 ${m.tok.in.toLocaleString()} + 답 ${m.tok.out.toLocaleString()})`:""}`, "", m.content, "");
    });
  } else {
    L.push("## 프롬프트 기록", "", fence(S.log), "");
  }
  return L.join("\n");
}

/* ───────── Claude API (웹사이트 버전 전용) ─────────
   API 키는 이 브라우저의 localStorage에만 저장해요. 코드·저장소에는 들어가지 않고,
   api.anthropic.com 호출에만 써요. */
const KEY_STORE = "vibe-mock-anthropic-key";
const MODELS = { exam:"claude-sonnet-4-6", complex:"claude-opus-5-5", default:"claude-sonnet-5-5", quick:"claude-haiku-5-5" };  // 실전(시험장과 같은 Sonnet 4.6)·상·중·하
const MAX_TOKENS = 8000;   // 한 번 답할 때 최대 출력 토큰. 작으면 긴 코드가 잘리고, 크면 답이 길어질 때 요금이 늘어요
const MAX_TOKENS_COMPLEX = 16000;  // 문제 출제·채점(성능 상)용. 숨은 테스트 코드까지 한 번에 써야 해서 더 길게 둠
function getKey(){ try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; } }
function setKey(k){ try{ if(k) localStorage.setItem(KEY_STORE, k); else localStorage.removeItem(KEY_STORE); }catch(e){} }

// 같은 역할이 연달아 오면 하나로 합침 (첫 지시문 + 첫 질문처럼)
function toMessages(input){
  const turns = typeof input === "string" ? [{ role:"user", content:input }] : input;
  const out = [];
  for(const t of turns){
    if(out.length && out[out.length-1].role === t.role) out[out.length-1].content += "\n\n" + t.content;
    else out.push({ role:t.role, content:t.content });
  }
  return out;
}

async function callClaude(input, opts = {}){
  // 실전 모델(Sonnet 4.6)을 이 키로 못 쓰면(404) 중 모델로 대신 답하고, 화면에 '다른 모델이 답했어요'가 떠요
  if((opts.modelTier || "default") === "exam"){
    try{ return await callClaudeOnce(input, opts); }
    catch(e){ if(e && e.status === 404) return await callClaudeOnce(input, Object.assign({}, opts, { modelTier:"default" })); throw e; }
  }
  return callClaudeOnce(input, opts);
}
async function callClaudeOnce(input, opts = {}){
  const key = getKey();
  if(!key) throw { code:"no_key" };
  const tier = opts.modelTier || "default";
  const maxTokens = opts.maxTokens || (tier === "complex" ? MAX_TOKENS_COMPLEX : MAX_TOKENS);
  const body = { model: MODELS[tier] || MODELS.default, max_tokens: maxTokens, stream: true, messages: toMessages(input) };
  let res;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: opts.signal,
      headers: { "content-type":"application/json", "x-api-key":key, "anthropic-version":"2023-06-01",
                 "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify(body),
    });
  }catch(e){
    throw { code: e && e.name === "AbortError" ? "cancelled" : "network" };
  }
  if(!res.ok){
    let message = "";
    try{ message = (await res.json()).error?.message || ""; }catch(e){}
    const code = (res.status === 401 || res.status === 403) ? "bad_key"
      : res.status === 429 ? "rate_limited" : res.status === 400 ? "bad_request" : "upstream_error";
    throw { code, message, status: res.status, model: body.model };
  }
  // 스트리밍 응답(SSE)을 읽으며 글자가 나오는 대로 화면에 보여 줌
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", stop = null;
  const usage = { input:0, output:0 };
  try{
    for(;;){
      const { value, done } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = chunk.split("\n").find(l => l.startsWith("data:"));
        if(!line) continue;
        let ev; try{ ev = JSON.parse(line.slice(5)); }catch(e){ continue; }
        if(ev.type === "message_start") usage.input = ev.message?.usage?.input_tokens || 0;
        else if(ev.type === "content_block_delta" && ev.delta?.type === "text_delta"){
          text += ev.delta.text;
          if(opts.onText) opts.onText({ text, delta: ev.delta.text });
        }
        else if(ev.type === "message_delta"){
          if(ev.usage?.output_tokens != null) usage.output = ev.usage.output_tokens;
          if(ev.delta?.stop_reason) stop = ev.delta.stop_reason;
        }
        else if(ev.type === "error") throw { code:"upstream_error", message: ev.error?.message, errType: ev.error?.type, model: body.model, text, usage };
      }
    }
  }catch(e){
    if(e && e.name === "AbortError") throw { code:"cancelled", text, usage };
    if(e && e.code) throw e;
    throw { code:"upstream_error", message: "응답을 읽다가 끊겼어요", model: body.model, text, usage };
  }
  if(!text.trim()) throw { code:"empty_completion", usage };
  return { text, truncated: stop === "max_tokens", modelTierApplied: tier, usage };
}

// 문자열 안에 줄바꿈·탭이 그대로 들어간 JSON(코드를 담을 때 흔함)을 \n 등으로 바꿔 줌
function repairJson(s){
  let out = "", inStr = false, escp = false;
  for(const ch of s){
    if(inStr){
      if(escp){ escp = false; out += ch; }
      else if(ch === "\\"){ escp = true; out += ch; }
      else if(ch === '"'){ inStr = false; out += ch; }
      else if(ch === "\n") out += "\\n";
      else if(ch === "\r") out += "\\r";
      else if(ch === "\t") out += "\\t";
      else out += ch;
    } else { if(ch === '"') inStr = true; out += ch; }
  }
  return out;
}
function tryParse(s){
  try{ return { ok:true, v:JSON.parse(s) }; }catch(e){}
  try{ return { ok:true, v:JSON.parse(repairJson(s)) }; }catch(e){}
  return { ok:false };
}
function parseJsonLoose(t){
  let r = tryParse(t); if(r.ok) return r.v;
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f){ r = tryParse(f[1]); if(r.ok) return r.v; }
  const starts = ["{","["].map(c => t.indexOf(c)).filter(i => i >= 0);
  const a = starts.length ? Math.min(...starts) : -1, b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if(a >= 0 && a < b){ r = tryParse(t.slice(a, b + 1)); if(r.ok) return r.v; }
  throw { code:"invalid_json", text:t };
}

// 아티팩트 버전의 claude.use("sample")과 같은 모양으로 맞춘 함수
function makeSample(){
  const f = (input, opts = {}) => callClaude(input, opts);
  f.json = async (input, opts = {}) => {
    const r = await callClaude(typeof input === "string" ? input + "\n\n다른 설명 없이 JSON 값 하나만 답해." : input, opts);
    if(r.truncated) throw { code:"invalid_json", truncated:true, text:r.text };
    return parseJsonLoose(r.text);
  };
  return f;
}

}

const GH_BUTTONS = ["ghSave","ghDel","ghTest","repDown","repDown2","repSave"];
function siteClick(b){

  }

        st.textContent = lines.join("\n");
      }
      st.className = bad ? "status err" : "status";
      st.style.whiteSpace = "pre-line";
    })().finally(() => { b.disabled = false; });

/* ───────── GitHub 비공개 저장소에 보고서·기록 저장 (웹사이트 버전 전용) ─────────
   토큰은 이 브라우저의 localStorage에만 저장해요. api.github.com 호출에만 써요. */
const GH_TOKEN_STORE = "vibe-mock-gh-token";
const GH_REPO_STORE = "vibe-mock-gh-repo";
const GH_INDEX = "records/index.json";   // 기록 목록(최신순). 보고서 본문은 reports/ 아래 .md
const pageOwner = (location.hostname.match(/^([^.]+)\.github\.io$/) || [])[1] || "";
let ghState = { status:"", busy:false, lastRec:null, saved:null };

function ghToken(){ try{ return localStorage.getItem(GH_TOKEN_STORE) || ""; }catch(e){ return ""; } }
function ghRepo(){ try{ return localStorage.getItem(GH_REPO_STORE) || (pageOwner ? pageOwner + "/vibe-mock-records" : ""); }catch(e){ return ""; } }
function ghSet(token, repo){ try{
  if(token) localStorage.setItem(GH_TOKEN_STORE, token); else localStorage.removeItem(GH_TOKEN_STORE);
  if(repo) localStorage.setItem(GH_REPO_STORE, repo); else localStorage.removeItem(GH_REPO_STORE);
}catch(e){} }
const ghReady = () => !!(ghToken() && ghRepo());

async function gh(path, opts = {}){
  const res = await fetch("https://api.github.com" + path, {
    method: opts.method || "GET",
    headers: { "Authorization":"Bearer " + ghToken(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28",
               ...(opts.body ? { "Content-Type":"application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if(res.status === 404 && opts.allow404) return null;
  if(!res.ok){
    let msg = ""; try{ msg = (await res.json()).message || ""; }catch(e){}
    throw { status: res.status, message: msg };
  }
  return res.status === 204 ? null : res.json();
}
// 한글이 깨지지 않게 UTF-8 ↔ base64
const b64 = s => { const bytes = new TextEncoder().encode(s); let bin = ""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode(...bytes.subarray(i,i+0x8000)); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));
const ghPathUrl = p => p.split("/").map(encodeURIComponent).join("/");
function ghErr(e){
  if(e && e.status === 401) return "GitHub 토큰이 맞지 않거나 만료됐어요.";
  if(e && e.status === 403) return "토큰에 이 저장소 쓰기 권한이 없어요. Contents: Read and write로 만들었는지 확인해 주세요.";
  if(e && e.status === 404) return "저장소를 찾지 못했어요. 이름과 토큰의 저장소 선택을 확인해 주세요.";
  if(e && e.status === 409) return "다른 기기에서 동시에 저장했어요. 다시 저장을 눌러 주세요.";
  return "GitHub에 연결하지 못했어요" + (e && e.message ? ": " + e.message : ".");
}

async function ghReadIndex(){
  const f = await gh(`/repos/${ghRepo()}/contents/${GH_INDEX}`, { allow404:true });
  return f ? { list: JSON.parse(unb64(f.content)), sha: f.sha } : { list: [], sha: null };
}
async function ghPut(path, text, message, sha){
  return gh(`/repos/${ghRepo()}/contents/${ghPathUrl(path)}`, { method:"PUT", body:{ message, content:b64(text), ...(sha ? { sha } : {}) } });
}
function reportPath(rec){
  const d = new Date(rec.at);
  const pad = n => String(n).padStart(2,"0");
  const day = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const slug = rec.taskTitle.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40);
  return `reports/${day.slice(0,7)}/${day}_${pad(d.getHours())}${pad(d.getMinutes())}_${slug}_${rec.total}점.md`;
}
async function ghSaveRecord(rec, md){
  const path = rec.report || reportPath(rec);
  const existing = await gh(`/repos/${ghRepo()}/contents/${ghPathUrl(path)}`, { allow404:true });
  await ghPut(path, md, `보고서: ${rec.taskTitle} ${rec.total}점`, existing && existing.sha);
  const entry = { ...rec, report: path };
  for(let attempt = 0; attempt < 2; attempt++){   // 목록 파일이 그사이 바뀌었으면 한 번만 다시 시도
    const idx = await ghReadIndex();
    const list = [entry, ...idx.list.filter(x => x.id !== rec.id)].slice(0, 1000);
    try{ await ghPut(GH_INDEX, JSON.stringify(list, null, 1), `기록: ${rec.taskTitle} ${rec.total}점`, idx.sha); return list; }
    catch(e){ if(e.status !== 409 && e.status !== 422 || attempt) throw e; }
  }
}
function siteReportUrl(path){ return `https://github.com/${ghRepo()}/blob/main/${ghPathUrl(path)}`; }
function siteHistoryNote(){ return ghReady() ? `기록과 보고서는 GitHub 저장소 ${esc(ghRepo())}에 저장돼요. 제목을 누르면 보고서가 열려요.` : "기록은 이 브라우저에만 저장돼요. 홈의 설정에서 GitHub 저장소를 연결하면 어느 기기에서든 남아요."; }
async function ghLoadHistory(){
  if(!ghReady()) return;
  try{ const idx = await ghReadIndex(); history = idx.list; if(["home","history","reports"].includes(S.view)) render(); }
  catch(e){ ghState.status = ghErr(e); if(["home","settings"].includes(S.view)) render(); }
}

function downloadReport(md, rec){
  rec = rec || ghState.lastRec || S.lastRec; if(!rec) return;
  md = md || buildReport(rec);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type:"text/markdown;charset=utf-8" }));
  a.download = (rec.report || reportPath(rec)).split("/").pop();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function siteAfterFinish(rec){
  ghState.lastRec = rec; ghState.saved = null; S.lastRec = rec; saveDraft();
  if(!ghReady()){ setResultStatus("GitHub 저장소를 연결하지 않아 이 브라우저에만 저장했어요. 보고서는 내려받을 수 있어요."); return; }
  await saveToGitHub();
}
async function saveToGitHub(){
  const rec = ghState.lastRec || S.lastRec; if(!rec || ghState.busy) return;
  ghState.busy = true; setResultStatus("GitHub 저장소에 보고서를 저장하는 중이에요.");
  try{
    rec.report = rec.report || reportPath(rec);
    const list = await ghSaveRecord(rec, buildReport(rec));
    history = list; ghState.saved = rec.report; saveDraft();
    setResultStatus("GitHub 저장소에 보고서를 저장했어요.");
  }catch(e){ ghState.saved = null; setResultStatus(ghErr(e) + " 결과는 이 브라우저에 남아 있어요.", true); }
  finally{ ghState.busy = false; }
}
function setResultStatus(t, err){
  ghState.status = t; ghState.err = !!err;
  const box = document.getElementById("reportBox"); if(box) box.outerHTML = siteResultActions();
}
function siteResultActions(){
  if(S.view !== "result") return "";
  const link = ghState.saved ? `<a href="${esc(siteReportUrl(ghState.saved))}" target="_blank" rel="noopener">GitHub에서 보고서 열기</a>` : "";
  return `<div class="block" id="reportBox"><h3>보고서</h3>
    <p class="status${ghState.err?" err":""}">${esc(ghState.status||"")}</p>
    <div class="actions"><button class="btn ghost sm" id="repDown">보고서 내려받기 (.md)</button>
    ${ghReady() && !ghState.saved ? `<button class="btn ghost sm" id="repSave">GitHub에 저장</button>` : ""}${link}</div></div>`;
}
function ghSettings(){
  const st = ghState.status && S.view === "setup" ? `<p class="status err">${esc(ghState.status)}</p>` : "";
  if(ghReady()) return `<section class="section"><h2>기록 저장소</h2>
    <p class="small">기록과 보고서를 GitHub 저장소 <b>${esc(ghRepo())}</b>에 저장해요.</p>
    <div class="actions"><button class="btn ghost sm" id="ghTest">연결 확인</button><button class="btn ghost sm" id="ghDel">연결 해제</button></div>
    <p class="status" id="ghStatus"></p>${st}</section>`;
  return `<section class="section"><h2>기록 저장소</h2>
    <p class="small">GitHub 비공개 저장소와 그 저장소만 쓸 수 있는 토큰(Contents: Read and write)을 넣으면, 기록과 보고서가 어느 기기에서든 남아요. 토큰은 이 브라우저에만 저장돼요.</p>
    <div class="field"><label for="ghRepoIn">저장소 (아이디/이름)</label><input id="ghRepoIn" type="text" autocomplete="off" spellcheck="false" value="${esc(ghRepo())}" placeholder="아이디/vibe-mock-records"></div>
    <div class="field"><label for="ghTokIn">토큰</label><input id="ghTokIn" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_..."></div>
    <div class="actions"><button class="btn sm" id="ghSave">연결</button></div>
    <p class="status" id="ghStatus"></p></section>`;
}
async function ghClick(b){
  const st = document.getElementById("ghStatus");
  if(b.id === "ghSave"){
    const repo = (document.getElementById("ghRepoIn").value || "").trim().replace(/^https:\/\/github\.com\//, "").replace(/\.git$/, "");
    const tok = (document.getElementById("ghTokIn").value || "").trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ st.className = "status err"; st.textContent = "저장소는 아이디/이름 모양으로 넣어 주세요."; return; }
    if(!tok){ st.className = "status err"; st.textContent = "토큰을 넣어 주세요."; return; }
    ghSet(tok, repo); st.className = "status"; st.textContent = "확인 중이에요."; b.disabled = true;
    try{
      const r = await gh(`/repos/${repo}`);
      if(r && r.permissions && r.permissions.push === false) throw { status:403 };
      ghState.status = ""; await ghLoadHistory(); render();
      const s2 = document.getElementById("ghStatus"); if(s2) s2.textContent = r.private ? "연결됐어요." : "연결됐어요. 다만 이 저장소는 공개 저장소라 보고서가 누구에게나 보여요.";
    }catch(e){ ghSet("", repo); st.className = "status err"; st.textContent = ghErr(e); b.disabled = false; }
    return;
  }
  if(b.id === "ghDel"){ ghSet("", ghRepo()); history = readLocalHist(); render(); return; }
  if(b.id === "ghTest"){
    st.className = "status"; st.textContent = "확인 중이에요.";
    try{ const r = await gh(`/repos/${ghRepo()}`); st.textContent = r.private ? "연결됐어요." : "연결됐어요(공개 저장소)."; }
    catch(e){ st.className = "status err"; st.textContent = ghErr(e); }
    return;
  }
  if(b.id === "repDown"){ downloadReport(); return; }
  if(b.id === "repDown2"){ if(S.reportState && S.reportState.md) downloadReport(S.reportState.md, S.reportRec); return; }
  if(b.id === "repSave"){ saveToGitHub(); return; }
}

/* 보고서 열람: GitHub 저장소에서 읽기 */
async function siteLoadReport(h){
  if(!ghReady() || !h.report) return null;
  const f = await gh(`/repos/${ghRepo()}/contents/${ghPathUrl(h.report)}`, { allow404:true });
  return f ? unb64(f.content) : null;
}
function siteReportActions(h, st){
  return `${st && st.md ? `<button class="btn ghost sm" id="repDown2">내려받기 (.md)</button>` : ""}${h.report && ghReady() ? `<a class="btn ghost sm" href="${esc(siteReportUrl(h.report))}" target="_blank" rel="noopener" style="text-decoration:none">GitHub에서 열기</a>` : ""}`;
}

/* ───────── 시작 ───────── */
history = readLocalHist();
sampleFn = getKey() ? makeSample() : null;
if(!sampleFn && S.env === "builtin") S.env = "own";
render();
ghLoadHistory();
})();

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>바이브코딩 모의고사</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 코딩테스트 플랫폼 느낌의 다크 화면(문제 | 코드·실행 | AI). 아래 기본 규칙은 예전 윈도 95 모양이고,
   스타일 맨 끝의 '다크 테마' 블록이 색·테두리·글꼴을 덮어써요. 다크 한 가지 화면으로만 만든다. */
:root{
  --desk:#7F8E8B; --face:#BDBEB8; --face-2:#CDCEC8; --hi:#F5F5F0; --shadow:#74756F; --dark:#3B3C38;
  --field:#F3F2ED; --field-2:#E7E6DF; --ink:#1E1F1C; --muted:#4D4E49;
  --title:#45696C; --title-ink:#EEEFE8; --title-off:#8E8F89; --sel:#B8CACB;
  --ok:#3D6338; --bad:#8C3B2E; --warn:#735A22;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Nanum Gothic Coding",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--title)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:#2F4F7A}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:13px;color:var(--muted)}

/* 입체 테두리 */
.raised,.btn,.choice,.card,.wrap > .section,.wrap > details,.wrap > .block,.wrap > .crit,.wrap > .score,.wrap > .self,.pane,.overlay .card,.seg button,.ftab,.ctab,.mtabs button{
  border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px var(--shadow),inset 1px 1px var(--face-2)}
.sunken,textarea,.field input[type=password],.field input[type=text],pre,.notice,.stream,.timer,.statusbar > span,.hidden-checks,.reqs,.bar,.editor,.console-body,.msgs,.ring{
  border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);box-shadow:inset 1px 1px var(--dark)}

/* 제목줄 (창 맨 위 청록 띠) */
.titlebar,.topbar{display:flex;align-items:center;gap:8px;background:var(--title);color:var(--title-ink);font-weight:700;font-size:14px;min-height:30px;padding-block:3px;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.tb-icon{width:14px;height:14px;background:var(--field);border:1px solid var(--dark);box-shadow:inset 3px 3px 0 var(--title);flex:none}
.titlebar .grow,.topbar .grow{flex:1}
.tb-btns{display:flex;gap:2px}
.tb-btns span{width:18px;height:16px;display:grid;place-items:center;font-size:11px;line-height:1;background:var(--face);color:var(--ink);border:1px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi)}
.topbar .crumb{font-weight:400;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:none}

/* 시작·제출·결과 화면 */
.page{min-height:100%}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.wrap > .section,.wrap > details,.wrap > .block,.wrap > .crit,.wrap > .score,.wrap > .self{background:var(--face);padding:0 0 14px;display:flex;flex-direction:column;gap:10px}
.wrap > .section > h2:first-child,.wrap > .block > h3:first-child{background:var(--title);color:var(--title-ink);font-size:14px;font-weight:700;padding:3px 8px;margin:0;display:flex;align-items:center;gap:8px}
.wrap > .section > :not(h2:first-child),.wrap > .block > :not(h3:first-child){margin-left:14px;margin-right:14px}
.wrap > .crit,.wrap > .score,.wrap > .self{padding:14px}
.wrap > details{padding:10px 14px}
.wrap > .qhead{color:var(--title-ink)}
.wrap > .qhead .qnum{color:#DDE3E1}
.wrap > .notice{background:var(--field)}
.page-title{font-family:var(--f-mono);font-size:22px;font-weight:700;color:var(--title-ink);text-shadow:1px 1px 0 var(--dark)}
.ticket{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.ticket span{background:var(--face);border:1px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);padding:1px 8px;white-space:nowrap}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:15px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{background:var(--face);padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice b{font-size:15px;font-weight:700}
.choice small{color:var(--muted);font-size:13px;line-height:1.5}
.choice[aria-pressed="true"]{border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);box-shadow:inset 1px 1px var(--dark);background:var(--face-2)}
.choice[aria-pressed="true"] b::before{content:"● ";color:var(--title)}
.choice:disabled{color:var(--shadow);cursor:not-allowed}
.choice:disabled small{color:var(--shadow)}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.mins .choice{flex:1 1 0;min-width:72px;text-align:center;align-items:center;font-family:var(--f-mono)}
@media (max-width:560px){.choices,.choices.two{grid-template-columns:1fr}}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--face);color:var(--ink);padding:5px 16px;font-size:14.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active:not(:disabled){border-color:var(--dark) var(--hi) var(--hi) var(--dark);box-shadow:inset 1px 1px var(--shadow);padding:6px 15px 4px 17px}
.btn:not(.ghost):not(.sm){font-weight:700;outline:1px solid var(--dark);outline-offset:0}
.btn.ghost{font-weight:400}
.btn.pen{font-weight:700}
.btn.sm{padding:2px 10px;font-size:13.5px;min-height:28px}
.btn:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi);cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:#2F4F7A;text-decoration:underline;font-size:13.5px}

.notice{background:var(--field);padding:10px 12px;font-size:14.5px}
.notice.pen{background:#F1E6E1}
.facts{display:grid;gap:10px;margin:8px 0 0;font-size:14.5px}
.facts dt{font-weight:700;font-size:14px}
.facts dd{margin:2px 0 0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px;border:1px solid currentColor;vertical-align:1px}
.chip.ok{color:var(--ok)} .chip.guess{color:var(--warn)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700}
.field input[type=password],.field input[type=text]{width:100%;background:var(--field);color:var(--ink);padding:6px 8px;font:inherit;font-family:var(--f-mono);font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--field);color:var(--ink);padding:8px 10px;font-family:var(--f-mono);font-size:14px;line-height:1.6}
pre{margin:0;background:var(--field);padding:10px 12px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;white-space:pre}
code{font-family:var(--f-mono);font-size:.94em;background:var(--field-2);padding:0 3px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:13.5px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--bad)}
.stream{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);max-height:160px;overflow:auto;background:var(--field);padding:8px 10px}
summary{cursor:pointer;font-weight:700;font-size:14.5px}
.tips{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.rules{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}

.hist{width:100%;border-collapse:collapse;font-size:14px;background:var(--field)}
.hist th{font-size:13px;font-weight:400;text-align:left;padding:3px 6px;background:var(--face);border:1px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi)}
.hist td{border-bottom:1px solid var(--field-2);padding:7px 6px;vertical-align:top}
.hist td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.hist td.s{font-weight:700}
.hist a{color:var(--ink);font-weight:700}
.tablewrap{overflow-x:auto;border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow)}

/* 바탕(책상) 위에 바로 놓이는 글자 */
.wrap > p,.wrap > .status{color:var(--title-ink)}
.wrap > .status.err{color:#FFD9CF}
.wrap > .section > h2 .muted{color:#D5DEDC}

/* 문제지 */
.qhead{display:flex;flex-direction:column;gap:2px}
.qnum{font-size:13px;color:var(--muted)}
.qtitle{font-family:var(--f-mono);font-size:20px;font-weight:700;line-height:1.35}
.block{display:flex;flex-direction:column;gap:8px}
.block h3{font-size:14.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.tag{font-size:12px;font-weight:400;border:1px solid var(--shadow);padding:0 6px;color:var(--muted);background:var(--face-2)}
.reqs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--field)}
.reqs li + li{border-top:1px solid var(--field-2)}
.reqs label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:7px 10px;cursor:pointer;align-items:start;font-size:14.5px}
.reqs input{width:15px;height:15px;margin:4px 0 0;accent-color:var(--title)}
.reqs input:checked + span{color:var(--muted);text-decoration:line-through}

/* ───── 시험 화면 ───── */
#app.ide{height:100%}
.ide{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--face)}
.menubar{flex:none;display:flex;align-items:center;gap:6px;min-height:38px;padding:4px 8px;border-bottom:1px solid var(--shadow);box-shadow:0 1px 0 var(--hi)}
.menubar .grow{flex:1}
.menubar .m{padding:2px 8px;font-size:14px;background:none;border:1px solid transparent}
.menubar button.m:hover{border-color:var(--hi) var(--shadow) var(--shadow) var(--hi)}
.menubar .m u{text-decoration:underline}
.timer{font-family:var(--f-mono);font-weight:700;font-size:18px;letter-spacing:.04em;padding:1px 10px;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.statusbar{flex:none;display:flex;gap:4px;padding:3px 4px;font-size:13px;border-top:1px solid var(--hi);min-width:0}
.statusbar > span{padding:1px 8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--face)}
.statusbar .phase-now{flex:1;display:block}
.phase-now b{font-weight:700}
.phase-now span{margin-left:6px}
.phases{display:grid;grid-template-columns:10fr 15fr 35fr 25fr 15fr;gap:2px;width:150px;flex:none;align-items:center}
.ph{height:10px;background:var(--field);position:relative;overflow:hidden;border:1px solid var(--shadow)}
.ph i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(90deg,var(--title) 0 6px,transparent 6px 8px)}
.meter{display:flex;gap:10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meter b{font-weight:700}
.meter .warn b{color:var(--bad)}
.mtabs{display:none}
.ide-main{flex:1;min-height:0;display:grid;grid-template-columns:var(--w1,30%) 10px minmax(0,1fr) 10px var(--w3,30%);padding:6px;gap:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--face)}
.pane-head{flex:none;display:flex;align-items:center;gap:8px;background:var(--title);color:var(--title-ink);font-weight:700;font-size:13.5px;padding:2px 6px;height:24px}
.pane-head::before{content:"";width:12px;height:12px;background:var(--field);border:1px solid var(--dark);box-shadow:inset 2px 2px 0 var(--title);flex:none}
.pane-body{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px;background:var(--field);margin:4px;border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow)}
.gutter{cursor:col-resize;position:relative;touch-action:none}
/* 손잡이: 가운데 오목한 세로 홈 두 줄 */
.gutter::after{content:"";position:absolute;left:2px;width:2px;top:50%;height:48px;margin-top:-24px;border-left:1px solid var(--shadow);border-right:1px solid var(--hi);box-shadow:3px 0 0 -1px var(--shadow)}
.gutter:hover,.gutter.drag{background:var(--face-2)}
/* 코드 창 */
.filetabs{flex:none;display:flex;align-items:flex-end;gap:0;padding:6px 6px 0;overflow-x:auto;border-bottom:2px solid var(--hi);margin:0 4px}
.ftab{background:var(--face);border-bottom:0;box-shadow:none;padding:2px 4px 2px 10px;font-family:var(--f-mono);font-size:13px;display:flex;align-items:center;gap:4px;margin-right:-2px;position:relative;top:2px;white-space:nowrap}
.ftab[aria-selected="true"]{z-index:1;padding-top:4px;margin-top:-2px;font-weight:700;background:var(--face)}
.ftab .x{padding:0 4px;color:var(--muted)}
.ftab .x:hover{color:var(--ink)}
.ftab-add{background:none;border:0;padding:0 10px;font-size:16px;color:var(--muted)}
#codeCount{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;padding:0 6px;white-space:nowrap}
.editor{flex:1;min-height:0;position:relative;margin:0 4px;background:var(--field)}
.editor textarea.fallback{position:absolute;inset:0;width:100%;height:100%;border:0;box-shadow:none;resize:none;tab-size:4;white-space:pre;overflow:auto}
.hgutter{flex:none;height:10px;cursor:row-resize;position:relative;touch-action:none;margin:0 4px}
.hgutter::after{content:"";position:absolute;top:3px;height:2px;left:50%;width:48px;margin-left:-24px;border-top:1px solid var(--shadow);border-bottom:1px solid var(--hi)}
.hgutter:hover,.hgutter.drag{background:var(--face-2)}
.console{flex:none;height:var(--hc,34%);min-height:60px;display:flex;flex-direction:column;padding:0 4px 4px}
.console-bar{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:2px 0 0}
.ctabs{display:flex;align-items:flex-end}
.ctab{background:var(--face);border-bottom:0;box-shadow:none;font-size:13px;padding:2px 10px;margin-right:-2px;position:relative;top:2px}
.ctab[aria-selected="true"]{z-index:1;padding-top:4px;font-weight:700}
.console-bar .actions{padding-bottom:3px}
.console-body{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--field)}
.console-body textarea{flex:1;min-height:0;border:0;box-shadow:none;resize:none;background:transparent;font-size:13.5px}
.console-status{flex:none;font-size:12.5px;color:var(--muted);padding:3px 2px 0;min-height:22px}
.console-status.err{color:var(--bad)}
/* AI 창 */
.chat{flex:1;min-height:0;display:flex;flex-direction:column;padding:4px;gap:6px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:14px;background:var(--field)}
.msg{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .who{font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.msg .who .tok.warn{color:var(--bad);font-weight:700}
.warn-text{color:var(--bad);font-weight:700}
#sendMeter{font-family:var(--f-mono);font-size:12.5px}
.msg.me .who::before{content:"나> ";color:var(--title);font-weight:700}
.msg.ai .who::before{content:"AI> ";color:var(--bad);font-weight:700}
.msg .body{min-width:0;display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.7}
.msg.me .body{background:var(--face-2);border:1px solid var(--shadow);padding:6px 10px}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.codebox{border:1px solid var(--shadow);background:var(--field)}
.codebox .cb-bar{display:flex;justify-content:flex-end;gap:4px;background:var(--face);padding:2px 4px;border-bottom:1px solid var(--shadow)}
.codebox .cb-bar button{background:var(--face);border:1px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);font-size:12px;padding:0 8px}
.codebox pre{border:0;box-shadow:none}
.empty{color:var(--muted);font-size:14px;line-height:1.7}
.composer{flex:none;display:flex;flex-direction:column;gap:6px}
.composer textarea{height:88px;min-height:56px;resize:none;font-family:var(--f-body);font-size:14.5px}
#agutter{margin:0}
.composer .opts{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.composer label.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.composer input[type=checkbox]{accent-color:var(--title);width:14px;height:14px}
/* 시작 전 안내 창 */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(40,48,46,.45);display:flex;align-items:center;justify-content:center;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px}
.overlay .card{max-width:540px;width:100%;max-height:100%;overflow:auto;background:var(--face);display:flex;flex-direction:column;gap:12px;padding:0 0 14px}
.overlay .card > h2{background:var(--title);color:var(--title-ink);font-size:14px;padding:3px 8px}
.overlay .card > :not(h2){margin:0 16px}

/* 휴대폰: 세 창을 탭으로 */
@media (max-width:900px){
  .meter{display:none}
  .titlebar .crumb{display:none}
  .phases{width:80px}
  .mtabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:4px 6px 0;border-bottom:2px solid var(--hi)}
  .mtabs button{background:var(--face);border-bottom:0;box-shadow:none;padding:5px 0;font-size:14px;margin-right:-2px;position:relative;top:2px}
  .mtabs button[aria-selected="true"]{z-index:1;font-weight:700;padding-top:7px;margin-top:-2px}
  .ide-main{display:flex;flex-direction:column}
  .gutter{display:none}
  .pane{flex:1}
  .pane[data-m-hidden]{display:none}
  .console{height:auto;flex:1}
  .p-code[data-mt="code"] .console,.p-code[data-mt="run"] .editor,.p-code[data-mt="run"] .filetabs,.p-code .hgutter{display:none}
  .p-code[data-mt="run"] .console{display:flex}
  .menubar .m.opt{display:none}
  .menubar{gap:4px;flex-wrap:wrap}
}

/* ───── 페이지 메뉴 · 홈(바탕화면) · 보고서 ───── */
.pagemenu{position:sticky;top:calc(env(safe-area-inset-top,0px) + 30px);z-index:19;background:var(--face);overflow-x:auto;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.pagemenu .m{background:none;border:1px solid transparent;padding:2px 10px;font-size:14px;white-space:nowrap}
.pagemenu .m:hover{border-color:var(--hi) var(--shadow) var(--shadow) var(--hi)}
.pagemenu .m[aria-current="true"]{border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);background:var(--face-2);font-weight:700}
.wrap.wide{max-width:1000px}
.desktop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.dicons{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.dicon{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;padding:4px;color:var(--title-ink);font-size:13.5px;text-align:center}
.dicon span{padding:0 3px;text-shadow:1px 1px 0 var(--dark)}
.dicon:hover span,.dicon:focus-visible span{background:var(--title);text-shadow:none;outline:1px dotted var(--title-ink)}
.dicon:focus-visible{outline:none}
.dicon svg{image-rendering:pixelated;shape-rendering:crispEdges}
.window{background:var(--face);border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px var(--shadow),inset 1px 1px var(--face-2)}
.window > h2{background:var(--title);color:var(--title-ink);font-size:14px;font-weight:700;padding:3px 8px}
.win-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.home-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--field);padding:8px 10px;display:flex;flex-direction:column;border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow)}
.stat span{font-size:12.5px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:26px;line-height:1.2}
@media (max-width:640px){
  .desktop{grid-template-columns:1fr}
  .dicons{flex-direction:row;flex-wrap:wrap;justify-content:space-around;gap:6px}
  .dicon{width:80px}
}
.replist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--field);border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow)}
.replist li + li{border-top:1px solid var(--field-2)}
.repitem{width:100%;background:none;border:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:6px 10px}
.repitem:hover,.repitem:focus-visible{background:var(--sel)}
.repicon svg{width:28px;height:28px}
.reptext{display:flex;flex-direction:column;min-width:0}
.reptext b{font-weight:700}
.repscore{font-family:var(--f-mono);font-weight:700}
.report-win > .md{margin:0 14px;background:var(--field);padding:14px 18px;border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);display:flex;flex-direction:column;gap:10px;font-size:15px}
.md h2{font-family:var(--f-mono);font-size:19px}
.md h3{font-size:16px;border-bottom:1px solid var(--shadow);padding-bottom:2px;margin-top:8px}
.md h4,.md h5{font-size:14.5px;color:var(--title)}
.md ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.md li.task{list-style:none;margin-left:-18px}
.md blockquote{margin:0;padding:6px 10px;border-left:3px solid var(--title);background:var(--field-2)}
.md pre{white-space:pre-wrap;word-break:break-all}
.md .tablewrap{border:1px solid var(--shadow)}

/* 채점 결과 */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{background:var(--field);padding:10px 18px;text-align:center;font-family:var(--f-mono)}
.ring b{font-size:34px;font-weight:700;display:block;line-height:1.1}
.ring small{font-size:13px;color:var(--muted)}
.score-side{display:flex;flex-direction:column;gap:4px;min-width:0}
.score-side .pen{font-size:14px;font-weight:700;color:var(--title)}
.crit{display:flex;flex-direction:column;gap:12px}
.crow{display:flex;flex-direction:column;gap:4px}
.crow-top{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.crow-top b{font-weight:700}
.crow-top span{font-family:var(--f-mono);color:var(--muted)}
.bar{height:16px;background:var(--field);padding:2px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--title) 0 8px,transparent 8px 10px)}
.crow p{font-size:14px;color:var(--muted)}
.penlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.penlist li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:14.5px}
.penlist li::before{content:"√";font-weight:700;color:var(--ok);font-family:var(--f-mono)}
.penlist.fix li::before{content:"►";color:var(--bad);font-size:11px;line-height:2}
.penlist.q li::before{content:"?";font-weight:700;color:var(--title);font-family:var(--f-mono)}
.hidden-checks{list-style:none;margin:0;padding:0;background:var(--field)}
.hidden-checks li{padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14.5px}
.hidden-checks li + li{border-top:1px solid var(--field-2)}
.mark{font-family:var(--f-mono);font-weight:700;width:18px;text-align:center}
.mark.o{color:var(--ok)} .mark.x{color:var(--bad)} .mark.q{color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-family:var(--f-mono)}
.stats span{background:var(--face);border:1px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);padding:1px 8px}
.stats b{font-weight:700}
.self{display:flex;flex-direction:column;gap:12px}
.self-row{display:flex;flex-direction:column;gap:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{background:var(--face);padding:4px 6px;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--dark) var(--hi) var(--hi) var(--dark);box-shadow:inset 1px 1px var(--shadow);font-weight:700;background:var(--face-2)}
@media (max-width:460px){.score{grid-template-columns:1fr;justify-items:start}}

/* CodeMirror (5.65.18, MIT) 기본 스타일 + 밝은 에디터 색 */
.CodeMirror{font-family:var(--f-mono);font-size:14px;line-height:1.6;height:100%;position:absolute;inset:0;background:var(--field);color:var(--ink);direction:ltr}
.CodeMirror-lines{padding:6px 0}
.CodeMirror pre.CodeMirror-line,.CodeMirror pre.CodeMirror-line-like{padding:0 10px;background:transparent;border:0;border-radius:0;box-shadow:none;font-family:inherit;font-size:inherit;margin:0;white-space:pre;word-wrap:normal;line-height:inherit;color:inherit;z-index:2;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent;font-variant-ligatures:contextual}
.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{background-color:var(--face)}
.CodeMirror-gutters{border-right:1px solid var(--shadow);background-color:var(--field-2);white-space:nowrap;position:absolute;left:0;top:0;min-height:100%;z-index:3}
.CodeMirror-linenumber{padding:0 8px 0 6px;min-width:22px;text-align:right;color:#80817B;white-space:nowrap}
.CodeMirror-cursor{border-left:2px solid var(--ink);border-right:none;width:0}
.CodeMirror div.CodeMirror-secondarycursor{border-left:1px solid var(--muted)}
.cm-fat-cursor .CodeMirror-cursor{width:auto;border:0!important;background:var(--sel)}
.CodeMirror-activeline-background{background:#EAE9E2}
.CodeMirror-selected{background:#D5DCD9!important}
.CodeMirror-focused .CodeMirror-selected{background:var(--sel)!important}
.CodeMirror-line::selection,.CodeMirror-line>span::selection,.CodeMirror-line>span>span::selection{background:var(--sel)}
.CodeMirror-matchingbracket{color:var(--ink)!important;background:#D9E3C7;outline:1px solid #8FA474}
.CodeMirror-nonmatchingbracket{color:var(--bad)!important}
.cm-s-default .cm-keyword{color:#3C6266;font-weight:700}.cm-s-default .cm-def{color:#2F4F7A;font-weight:700}.cm-s-default .cm-variable-2{color:#5B4A7C}
.cm-s-default .cm-builtin{color:#4A6A3A}.cm-s-default .cm-string{color:#7C4E3A}.cm-s-default .cm-string-2{color:#7C4E3A}
.cm-s-default .cm-number{color:#6B4F86}.cm-s-default .cm-comment{color:#86877F;font-style:italic}.cm-s-default .cm-operator{color:#4D4E49}
.cm-s-default .cm-meta{color:#735A22}.cm-s-default .cm-property{color:#2F4F7A}.cm-s-default .cm-atom{color:#6B4F86}.cm-s-default .cm-variable{color:var(--ink)}
.cm-s-default .cm-error{color:var(--bad)}
.CodeMirror{overflow:hidden}
.CodeMirror-scroll{overflow:scroll!important;margin-bottom:-50px;margin-right:-50px;padding-bottom:50px;height:100%;outline:0;position:relative;z-index:0}
.CodeMirror-sizer{position:relative;border-right:50px solid transparent}
.CodeMirror-vscrollbar,.CodeMirror-hscrollbar,.CodeMirror-scrollbar-filler,.CodeMirror-gutter-filler{position:absolute;z-index:6;display:none;outline:0}
.CodeMirror-vscrollbar{right:0;top:0;overflow-x:hidden;overflow-y:scroll}
.CodeMirror-hscrollbar{bottom:0;left:0;overflow-y:hidden;overflow-x:scroll}
.CodeMirror-scrollbar-filler{right:0;bottom:0}
.CodeMirror-gutter-filler{left:0;bottom:0}
.CodeMirror-gutter{white-space:normal;height:100%;display:inline-block;vertical-align:top;margin-bottom:-50px}
.CodeMirror-gutter-wrapper{position:absolute;z-index:4;background:none!important;border:none!important}
.CodeMirror-gutter-background{position:absolute;top:0;bottom:0;z-index:4}
.CodeMirror-gutter-elt{position:absolute;cursor:default;z-index:4}
.CodeMirror-gutter-wrapper ::selection{background-color:transparent}
.CodeMirror-lines{cursor:text;min-height:1px}
.CodeMirror-wrap pre.CodeMirror-line,.CodeMirror-wrap pre.CodeMirror-line-like{word-wrap:break-word;white-space:pre-wrap;word-break:normal}
.CodeMirror-linebackground{position:absolute;left:0;right:0;top:0;bottom:0;z-index:0}
.CodeMirror-linewidget{position:relative;z-index:2;padding:.1px}
.CodeMirror-code{outline:0}
.CodeMirror-scroll,.CodeMirror-sizer,.CodeMirror-gutter,.CodeMirror-gutters,.CodeMirror-linenumber{box-sizing:content-box}
.CodeMirror-measure{position:absolute;width:100%;height:0;overflow:hidden;visibility:hidden}
.CodeMirror-cursor{position:absolute;pointer-events:none}
.CodeMirror-measure pre{position:static}
div.CodeMirror-cursors{visibility:hidden;position:relative;z-index:3}
div.CodeMirror-dragcursors{visibility:visible}
.CodeMirror-focused div.CodeMirror-cursors{visibility:visible}
.cm-force-border{padding-right:.1px}
.cm-tab{display:inline-block;text-decoration:inherit}
span.CodeMirror-selectedtext{background:0 0}

/* ═════ 다크 테마: 코딩테스트 플랫폼(구름·프로그래머스) 느낌. 위의 윈도 95 스타일을 덮어써요 ═════ */
:root{
  --desk:#0f1620; --face:#18222f; --face-2:#223042; --hi:#2b394c; --shadow:#2b394c; --dark:#0a0f15;
  --field:#121b26; --field-2:#1f2a38; --ink:#e3e9f1; --muted:#8b9bb0;
  --title:#18222f; --title-ink:#e3e9f1; --title-off:#5c6b7e; --sel:#21466e;
  --ok:#3fb97a; --bad:#f26d6d; --warn:#e0a83a;
  --line:#263446; --accent:#3d8bfd; --accent-2:#2f74d8;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:var(--desk);color:var(--ink);font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{background:var(--face)}
a,.linkbtn{color:#6cb0ff}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#2a394c;border-radius:6px;border:2px solid transparent;background-clip:padding-box} ::-webkit-scrollbar-track{background:transparent}

/* 입체 테두리 → 얇은 선 */
.raised,.btn,.choice,.card,.wrap > .section,.wrap > details,.wrap > .block,.wrap > .crit,.wrap > .score,.wrap > .self,.pane,.overlay .card,.seg button,.ftab,.ctab,.mtabs button,
.sunken,textarea,.field input[type=password],.field input[type=text],pre,.notice,.stream,.timer,.statusbar > span,.hidden-checks,.reqs,.bar,.editor,.console-body,.msgs,.ring,
.window,.stat,.replist,.report-win > .md,.tablewrap,.stats span,.ticket span{border:1px solid var(--line);box-shadow:none}

/* 맨 위 막대 */
.titlebar,.topbar{background:var(--face);color:var(--ink);border-bottom:1px solid var(--line);min-height:44px;font-size:15px}
.tb-btns,.tb-icon{display:none}
.topbar .crumb,.titlebar .crumb{color:var(--muted);font-weight:400}
.pagemenu{top:calc(env(safe-area-inset-top,0px) + 44px);background:var(--face);border-bottom:1px solid var(--line)}
.pagemenu .m{border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--muted)}
.pagemenu .m:hover{border-color:transparent;color:var(--ink)}
.pagemenu .m[aria-current="true"]{background:none;border:0;border-bottom:2px solid var(--accent);color:var(--ink);font-weight:700}

/* 페이지 */
.wrap{gap:16px}
.page-title{font-family:var(--f-body);color:var(--ink);text-shadow:none;font-size:22px}
.wrap > p,.wrap > .status{color:var(--muted)}
.wrap > .status.err{color:var(--bad)}
.wrap > .qhead{color:var(--ink)} .wrap > .qhead .qnum{color:var(--muted)}
.wrap > .section,.wrap > details,.wrap > .block,.wrap > .crit,.wrap > .score,.wrap > .self{background:var(--face);border-radius:10px;overflow:hidden}
.wrap > .section > h2:first-child,.wrap > .block > h3:first-child{background:transparent;color:var(--ink);font-size:15px;padding:14px 16px 0}
.wrap > .section > h2 .muted{color:var(--muted)}
.ticket span{background:var(--face-2);border-radius:999px;padding:2px 10px}
.choice{background:var(--face-2);border-radius:8px;padding:10px 12px}
.choice:hover:not(:disabled){border-color:#3a4b61}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:rgba(61,139,253,.12)}
.choice[aria-pressed="true"] b::before{content:"✓ ";color:var(--accent)}
.choice:disabled{opacity:.45;color:var(--ink)}
.btn{background:var(--face-2);color:var(--ink);border-radius:6px;padding:5px 14px}
.btn:hover:not(:disabled){background:#2a3a4f}
.btn:active:not(:disabled){border-color:var(--line);box-shadow:none;padding:5px 14px}
.btn:not(.ghost):not(.sm){outline:none;background:var(--accent);border-color:var(--accent);color:#fff}
.btn:not(.ghost):not(.sm):hover:not(:disabled){background:var(--accent-2)}
.btn.sm{border-radius:6px}
.btn:disabled{opacity:.45;color:var(--ink);text-shadow:none}
.notice{background:var(--field);border-radius:8px}
.notice.pen{background:#2a2216;border-color:#4d3d1f}
.field input[type=password],.field input[type=text],textarea{background:var(--field);border-radius:6px}
.field input:focus,textarea:focus{border-color:var(--accent);outline:none}
pre{background:var(--field);border-radius:6px}
code{background:var(--field-2);border-radius:4px;padding:1px 5px}
.hist{background:var(--field)}
.hist th{background:var(--face-2);border:0;border-bottom:1px solid var(--line);color:var(--muted)}
.hist td{border-bottom:1px solid var(--line)}
.tablewrap{border-radius:8px}
.tag{background:var(--face-2);border-color:var(--line);border-radius:999px;color:var(--muted)}

/* 홈 */
.dicon{color:var(--ink);border-radius:10px;padding:10px 6px}
.dicon span{text-shadow:none}
.dicon:hover,.dicon:focus-visible{background:var(--face)}
.dicon:hover span,.dicon:focus-visible span{background:none;outline:none}
.window{background:var(--face);border-radius:10px;overflow:hidden}
.window > h2{background:transparent;color:var(--ink);font-size:16px;padding:16px 16px 0}
.stat{background:var(--field);border-radius:8px}
.replist{background:var(--field);border-radius:8px;overflow:hidden}
.replist li + li{border-top:1px solid var(--line)}
.repitem:hover,.repitem:focus-visible{background:var(--face-2)}
.report-win > .md{background:var(--field);border-radius:8px}
.md h3{border-bottom:1px solid var(--line)}
.md h4,.md h5{color:#6cb0ff}
.md blockquote{border-left-color:var(--accent);background:var(--field-2)}

/* 결과 */
.ring{background:var(--field);border-radius:10px}
.bar{background:var(--field-2);border:0;border-radius:4px;padding:0;height:10px}
.bar i{background:var(--accent);border-radius:4px}
.stats span{background:var(--face-2);border-radius:999px;padding:2px 10px}
.score-side .pen{color:#6cb0ff}
.penlist.q li::before{color:#6cb0ff}
.hidden-checks{background:var(--field);border-radius:8px}
.hidden-checks li + li{border-top:1px solid var(--line)}
.seg button{background:var(--face-2);border-radius:6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:rgba(61,139,253,.12)}
.overlay{background:rgba(3,7,12,.65)}
.overlay .card{background:var(--face);border-radius:12px;padding:0 0 18px}
.overlay .card > h2{background:transparent;color:var(--ink);font-size:17px;padding:18px 18px 0}
.overlay .card > :not(h2){margin:0 18px}

/* ───── 시험 화면 ───── */
.ide{background:var(--desk)}
.menubar{background:var(--face);border-bottom:1px solid var(--line);box-shadow:none;min-height:46px;padding:6px 12px}
.menubar .m{border:0;border-radius:6px;color:var(--muted);padding:4px 10px}
.menubar button.m:hover{border-color:transparent;background:var(--face-2);color:var(--ink)}
.menubar .m u{text-decoration:none}
.timer{background:var(--field);border-radius:6px;color:var(--ink);font-size:17px;padding:2px 12px}
.timer.low{color:var(--bad);border-color:#5b2a2a}
.statusbar{background:var(--face);border-top:1px solid var(--line);padding:4px 10px;gap:12px;font-size:12.5px;color:var(--muted)}
.statusbar > span{background:none;border:0;padding:1px 0}
.phase-now b{color:var(--ink)}
.ph{background:var(--field-2);border:0;border-radius:3px;height:6px}
.ph i{background:var(--accent)}
.meter .warn b{color:var(--bad)}
.ide-main{padding:0;grid-template-columns:var(--w1,32%) 6px minmax(0,1fr) 6px var(--w3,28%)}
.gutter{background:var(--desk)}
.gutter::after{left:2px;width:2px;height:40px;margin-top:-20px;border:0;box-shadow:none;background:#33445a;border-radius:2px}
.gutter:hover,.gutter.drag{background:#1a2635}
.gutter:hover::after,.gutter.drag::after{background:var(--accent)}
.pane{background:var(--face);border:0;border-radius:0}
.pane-head{background:var(--face);color:var(--ink);height:40px;padding:0 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
.pane-head::before{display:none}
.pane-body{background:var(--face);margin:0;border:0;padding:20px 22px 28px;gap:24px}
.filetabs{background:var(--face);border-bottom:1px solid var(--line);margin:0;padding:0 8px;align-items:stretch;min-height:40px}
.ftab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;top:0;margin:0;padding:0 8px 0 12px;color:var(--muted);font-size:12.5px}
.ftab[aria-selected="true"]{background:transparent;border-bottom-color:var(--accent);color:var(--ink);padding-top:0;margin-top:0}
.ftab-add{color:var(--muted)}
.editor{margin:0;background:var(--field);border:0}
.hgutter{margin:0;background:var(--desk);height:6px}
.hgutter::after{top:2px;height:2px;border:0;background:#33445a;border-radius:2px}
.hgutter:hover,.hgutter.drag{background:#1a2635}
.hgutter:hover::after,.hgutter.drag::after{background:var(--accent)}
.console{padding:0;background:var(--face)}
.console-bar{background:var(--face);border-bottom:1px solid var(--line);padding:0 8px;align-items:center;min-height:40px}
.ctab{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;top:0;margin:0;padding:9px 12px;color:var(--muted);font-size:13px}
.ctab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);padding-top:9px}
.console-bar .actions{padding-bottom:0}
.console-body{background:var(--field);border:0;border-radius:0}
.console-body textarea{color:#cdd6e2}
.console-status{padding:4px 10px;background:var(--field)}
/* AI 창 */
.chat{padding:0;gap:0;background:var(--face)}
.msgs{background:var(--face);border:0;padding:16px}
.msg .who{color:var(--muted);font-family:var(--f-body);font-size:12px}
.msg.me .who::before,.msg.ai .who::before{content:none}
.msg.me{align-items:flex-end}
.msg.me .body{background:#223650;border:0;border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:92%}
.msg.ai .body{max-width:100%}
.codebox{border-radius:8px;overflow:hidden;border-color:var(--line)}
.codebox .cb-bar{background:var(--face-2);border-bottom:1px solid var(--line)}
.codebox .cb-bar button{background:transparent;border:0;color:var(--muted);border-radius:4px;padding:2px 8px}
.codebox .cb-bar button:hover{background:#2a3a4f;color:var(--ink)}
.codebox pre{border-radius:0}
.composer{padding:10px 12px 8px;border-top:1px solid var(--line);background:var(--face)}

<script type="text/plain" id="hid-prelude">
import sys
import pytest
from fastapi.testclient import TestClient


def _fresh_app():
    # 테스트마다 main을 새로 불러와 저장된 상태를 비움
    for name in list(sys.modules):
        if name == "main" or name.startswith("main."):
            del sys.modules[name]
    import main
    return main.app


@pytest.fixture
def c():
    return TestClient(_fresh_app())


def code_of(r):
    try:
        j = r.json()
    except Exception:
        return None
    if isinstance(j, dict):
        if "code" in j:
            return j["code"]
        d = j.get("detail")
        if isinstance(d, dict):
            return d.get("code")
    return None

<script type="text/plain" id="hid-sw-parcel">
STEPS = ["집화", "간선이동", "배송출발", "배송완료"]


def mk(c, no="P1"):
    return c.post("/parcels", json={"tracking_no": no, "receiver": "김OO", "dest": "서울 용산구"})


def ev(c, no, st, at):
    return c.post(f"/parcels/{no}/events", json={"status": st, "at": at})


def test_01_create_get(c):
    """송장 등록 직후 상태는 접수, 이력은 빈 목록"""
    r = mk(c)
    assert r.status_code == 201
    assert r.json()["status"] == "접수"
    g = c.get("/parcels/P1")
    assert g.status_code == 200
    j = g.json()
    assert j["status"] == "접수" and j["history"] == [] and j["receiver"] == "김OO"


def test_02_duplicate_parcel(c):
    """같은 송장번호를 다시 등록하면 409"""
    mk(c)
    assert mk(c).status_code == 409


def test_03_full_flow(c):
    """접수부터 배송완료까지 순서대로 진행"""
    mk(c)
    for i, s in enumerate(STEPS):
        r = ev(c, "P1", s, f"2026-10-21T0{i + 1}:00:00+09:00")
        assert r.status_code == 201, (s, r.status_code)
    j = c.get("/parcels/P1").json()
    assert j["status"] == "배송완료"
    assert [h["status"] for h in j["history"]] == STEPS


def test_04_skip_step(c):
    """단계를 건너뛴 이벤트는 409, 상태는 그대로"""
    mk(c)
    assert ev(c, "P1", "간선이동", "2026-10-21T01:00:00+09:00").status_code == 409
    assert c.get("/parcels/P1").json()["status"] == "접수"


def test_05_backward(c):
    """배송완료 뒤 거꾸로 가는 이벤트는 409"""
    mk(c)
    for i, s in enumerate(STEPS):
        ev(c, "P1", s, f"2026-10-21T0{i + 1}:00:00+09:00")
    assert ev(c, "P1", "집화", "2026-10-21T09:00:00+09:00").status_code == 409
    assert c.get("/parcels/P1").json()["status"] == "배송완료"


def test_06_idempotent_event(c):
    """같은 이벤트를 다시 보내면 200, 이력은 한 줄"""
    mk(c)
    a = ev(c, "P1", "집화", "2026-10-21T01:00:00+09:00")
    b = ev(c, "P1", "집화", "2026-10-21T01:00:00+09:00")
    assert a.status_code == 201 and b.status_code == 200
    assert len(c.get("/parcels/P1").json()["history"]) == 1


def test_07_not_found(c):
    """없는 송장 조회·이벤트는 404"""
    assert c.get("/parcels/NOPE").status_code == 404
    assert ev(c, "NOPE", "집화", "2026-10-21T01:00:00+09:00").status_code == 404


def test_08_unknown_status(c):
    """모르는 상태 이름은 400 또는 422"""
    mk(c)
    assert ev(c, "P1", "분실", "2026-10-21T01:00:00+09:00").status_code in (400, 422)


def test_09_delayed_timezone(c):
    """지연 목록: UTC(Z) 시각 섞임, 배송완료 제외, 경로 순서"""
    for no in ["A", "B", "C"]:
        mk(c, no)
        ev(c, no, "집화", "2026-10-19T10:00:00+09:00")
        ev(c, no, "간선이동", "2026-10-19T12:00:00+09:00")
    ev(c, "A", "배송출발", "2026-10-19T23:00:00Z")
    ev(c, "B", "배송출발", "2026-10-21T08:00:00+09:00")
    ev(c, "C", "배송출발", "2026-10-20T07:00:00+09:00")
    ev(c, "C", "배송완료", "2026-10-20T15:00:00+09:00")
    r = c.get("/parcels/delayed", params={"now": "2026-10-21T10:00:00+09:00"})
    assert r.status_code == 200
    assert sorted(r.json()) == ["A"]
</script>
<script type="text/plain" id="hid-sw-seat">
def show(c):
    r = c.post("/shows", json={})
    assert r.status_code == 201
    return r.json()["id"]


def book(c, s, seats, u="u1"):
    return c.post(f"/shows/{s}/bookings", json={"seats": seats, "user": u})


def booked(c, s):
    return set(c.get(f"/shows/{s}/seats").json()["booked"])


def test_01_book(c):
    """두 좌석 예매"""
    s = show(c)
    assert book(c, s, ["E7", "E8"]).status_code == 201
    assert booked(c, s) == {"E7", "E8"}


def test_02_conflict(c):
    """이미 예매된 좌석은 409"""
    s = show(c)
    book(c, s, ["E7"])
    assert book(c, s, ["E7"], "u2").status_code == 409


def test_03_all_or_nothing(c):
    """4좌석 중 1좌석이 찼으면 나머지도 안 잡힘"""
    s = show(c)
    book(c, s, ["E8"])
    assert book(c, s, ["E6", "E7", "E8", "E9"], "u2").status_code == 409
    assert booked(c, s) == {"E8"}


def test_04_cancel_rebook(c):
    """취소한 좌석은 다시 예매 가능"""
    s = show(c)
    bid = book(c, s, ["A1"]).json()["booking_id"]
    assert c.delete(f"/bookings/{bid}").status_code in (200, 204)
    assert book(c, s, ["A1"], "u2").status_code == 201


def test_05_invalid_seat(c):
    """K열, 0번, 13번 같은 범위 밖 좌석은 400 또는 422"""
    s = show(c)
    for bad in (["K1"], ["A0"], ["A13"], ["11"]):
        assert book(c, s, bad).status_code in (400, 422), bad
    assert booked(c, s) == set()


def test_06_empty_and_dup(c):
    """빈 목록과 같은 좌석 중복은 400 또는 422"""
    s = show(c)
    assert book(c, s, []).status_code in (400, 422)
    assert book(c, s, ["B2", "B2"]).status_code in (400, 422)
    assert booked(c, s) == set()


def test_07_shows_independent(c):
    """회차가 다르면 같은 좌석도 따로 예매"""
    a = show(c)
    b = show(c)
    book(c, a, ["C3"])
    assert book(c, b, ["C3"]).status_code == 201


def test_08_not_found(c):
    """없는 회차·예매는 404"""
    assert c.get("/shows/99999/seats").status_code == 404
    assert book(c, 99999, ["A1"]).status_code == 404
    assert c.delete("/bookings/99999").status_code == 404

<script type="text/plain" id="hid-sw-coupon">
def camp(c, total=3, exp="2026-10-31T23:59:59+09:00"):
    r = c.post("/campaigns", json={"name": "가을 15%", "total": total, "expires_at": exp})
    assert r.status_code == 201
    return r.json()["id"]


def issue(c, cid, u):
    return c.post(f"/campaigns/{cid}/issue", json={"user": u})


def test_01_create(c):
    """행사를 만들면 남은 수량이 총 수량과 같음"""
    cid = camp(c)
    j = c.get(f"/campaigns/{cid}").json()
    assert j["total"] == 3 and j["remaining"] == 3


def test_02_sold_out(c):
    """수량이 다 떨어지면 409 SOLD_OUT"""
    cid = camp(c, total=2)
    assert issue(c, cid, "u1").status_code == 201
    assert issue(c, cid, "u2").status_code == 201
    r = issue(c, cid, "u3")
    assert r.status_code == 409 and code_of(r) == "SOLD_OUT"
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 0


def test_03_one_per_user(c):
    """같은 사람이 두 번 받으면 409 ALREADY_ISSUED, 수량은 그대로"""
    cid = camp(c)
    issue(c, cid, "u1")
    r = issue(c, cid, "u1")
    assert r.status_code == 409 and code_of(r) == "ALREADY_ISSUED"
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 2


def test_04_use_twice(c):
    """사용 처리를 두 번 하면 두 번째는 409 ALREADY_USED"""
    cid = camp(c)
    k = issue(c, cid, "u1").json()["coupon_id"]
    a = c.post(f"/coupons/{k}/use", json={"now": "2026-10-25T12:00:00+09:00"})
    assert a.status_code == 200 and a.json()["used"] is True
    b = c.post(f"/coupons/{k}/use", json={"now": "2026-10-25T12:01:00+09:00"})
    assert b.status_code == 409 and code_of(b) == "ALREADY_USED"


def test_05_expired_utc(c):
    """UTC로 온 시각이 한국 시각으로 만료 뒤면 409 EXPIRED"""
    cid = camp(c, exp="2026-10-31T23:59:59+09:00")
    k = issue(c, cid, "u1").json()["coupon_id"]
    r = c.post(f"/coupons/{k}/use", json={"now": "2026-10-31T15:00:00Z"})
    assert r.status_code == 409 and code_of(r) == "EXPIRED"


def test_06_not_found(c):
    """없는 행사·쿠폰은 404"""
    assert c.get("/campaigns/99999").status_code == 404
    assert issue(c, 99999, "u1").status_code == 404
    assert c.post("/coupons/99999/use", json={"now": "2026-10-25T12:00:00+09:00"}).status_code == 404


def test_07_user_list(c):
    """내 쿠폰 목록"""
    a = camp(c)
    b = camp(c)
    issue(c, a, "u1")
    issue(c, b, "u1")
    issue(c, a, "u2")
    j = c.get("/users/u1/coupons").json()
    assert len(j) == 2 and all(x["used"] is False for x in j)


def test_08_failed_issue_keeps_count(c):
    """실패한 발급은 수량·목록에 남지 않음"""
    cid = camp(c, total=1)
    issue(c, cid, "u1")
    issue(c, cid, "u1")
    issue(c, cid, "u2")
    assert c.get(f"/campaigns/{cid}").json()["remaining"] == 0
    assert c.get("/users/u2/coupons").json() == []
</script>
<script type="text/plain" id="hid-de-orders">
CSV = (
    "order_id,ordered_at,category,amount\n"
    "A1001,2026-10-20T23:40:00+09:00,뷰티,18900\n"
    "A1001,2026-10-20T23:40:00+09:00,뷰티,18900\n"
    "A1002,2026-10-20T15:05:00Z,식품,12000\n"
    "A1003,2026-10-21T00:10:00+09:00,뷰티,-5000\n"
    "A1004,2026-10-21T09:00:00+09:00,뷰티,\n"
    "A1005,2026-10-21T10:00:00+09:00,식품,3000\n"
    "A1006,2026-10-20T14:59:00Z,식품,1000\n"
)


def up(c, text=CSV):
    r = c.post("/orders/upload", json={"csv": text})
    assert r.status_code == 200, r.text
    return r.json()


def sales(c, d):
    r = c.get("/sales", params={"date": d})
    assert r.status_code == 200
    return {x["category"]: (x["revenue"], x["orders"]) for x in r.json()}


def test_01_report(c):
    """처리 리포트 건수 (입력 7 · 정제 4 · 중복 1 · 격리 2)"""
    j = up(c)
    assert (j["input"], j["clean"], j["duplicates"], j["quarantined"]) == (7, 4, 1, 2)


def test_02_sum(c):
    """정제 + 중복 + 격리 = 입력"""
    j = up(c)
    assert j["clean"] + j["duplicates"] + j["quarantined"] == j["input"]


def test_03_sales_kst(c):
    """UTC 시각을 한국 날짜로 바꿔 집계 (20일)"""
    up(c)
    assert sales(c, "2026-10-20") == {"뷰티": (18900, 1), "식품": (1000, 1)}


def test_04_sales_next_day(c):
    """UTC 15:05는 한국 시각으로 다음 날 (21일)"""
    up(c)
    assert sales(c, "2026-10-21") == {"식품": (15000, 2)}


def test_05_quarantine(c):
    """음수·빈 금액은 격리 목록에"""
    up(c)
    q = c.get("/quarantine").json()
    assert sorted(x["order_id"] for x in q) == ["A1003", "A1004"]


def test_06_reupload_idempotent(c):
    """같은 파일을 다시 올려도 매출·격리가 늘지 않음"""
    up(c)
    j = up(c)
    assert j["clean"] == 0 and j["duplicates"] == 7
    assert sales(c, "2026-10-21") == {"식품": (15000, 2)}
    assert len(c.get("/quarantine").json()) == 2


def test_07_no_sales_day(c):
    """주문이 없는 날은 빈 목록"""
    up(c)
    assert c.get("/sales", params={"date": "2026-10-25"}).json() == []
</script>
<script type="text/plain" id="hid-de-inventory">
H = "store_id,sku,qty,snapshot_date\n"


def snap(c, body):
    return c.post("/snapshots", json={"csv": body})


def inv(c, s, k):
    return c.get(f"/inventory/{s}/{k}")


def test_01_insert(c):
    """새 키는 inserted"""
    j = snap(c, H + "S001,8801234,12,2026-10-20\nS002,8801234,7,2026-10-20\n").json()
    assert j["read"] == 2 and j["inserted"] == 2

"""출석부 라이브러리 (시험에서 제공하는 라이브러리예요. 고치지 마세요. 채점할 땐 원본으로 바뀌어요.)

출석번호는 이름 가나다순으로 1번부터 매겨요.
상태는 "출석", "지각", "결석" 세 가지예요.
"""

STATUSES = ("출석", "지각", "결석")


class RollBook:
    """한 반의 출석부.

    Args:
        names: 학생 이름 목록 (중복 없음)
    """

    def __init__(self, names):
        self._names = sorted(names)
        self._num = {n: i + 1 for i, n in enumerate(self._names)}
        self._marks = {}        # (date, name) -> status
        self.mark_calls = 0     # mark()를 부른 횟수

    def size(self) -> int:
        """학생 수"""
        return len(self._names)

    def number_of(self, name: str) -> int:
        """이름 → 출석번호. 없는 이름이면 KeyError"""
        return self._num[name]

    def name_of(self, number: int) -> str:
        """출석번호 → 이름. 없는 번호면 KeyError"""
        if not isinstance(number, int) or not 1 <= number <= len(self._names):
            raise KeyError(number)
        return self._names[number - 1]

    def mark(self, name: str, date: str, status: str) -> None:
        """그날 상태를 기록해요. 같은 날 다시 기록하면 덮어써요.
        모르는 상태면 ValueError, 없는 이름이면 KeyError"""
        if status not in STATUSES:
            raise ValueError(status)
        self._num[name]
        self.mark_calls += 1
        self._marks[(date, name)] = status

    def status(self, name: str, date: str):
        """그날 상태. 기록이 없으면 None"""
        return self._marks.get((date, name))

    def count(self, date: str, status: str) -> int:
        """그날 status인 학생 수. 모르는 상태면 ValueError"""
        if status not in STATUSES:
            raise ValueError(status)
        return sum(1 for (d, _), s in self._marks.items() if d == date and s == status)

    def dates(self) -> list:
        """기록이 있는 날짜 목록 (오름차순)"""
        return sorted({d for d, _ in self._marks})

# 예제 실행기: 문제의 예제를 돌려 통과/실패를 보여 줌. 오류가 나면 파이썬 오류 메시지를 그대로 보여 줌
import sys
import traceback


def _show_error(e):
    te = traceback.TracebackException.from_exception(e)
    mine = [f for f in te.stack if not f.filename.endswith("_examples.py")]
    if mine:
        te.stack = traceback.StackSummary.from_list(mine)
    import os
    print("".join(te.format()).replace(os.getcwd() + "/", ""), end="")


def _run(cases):
    ok = 0
    for i, (desc, make) in enumerate(cases, 1):
        print(f"예제 {i} · {desc}")
        try:
            got, want = make()
        except Exception as e:
            _show_error(e)
            print("  → 실패 (오류)\n")
            continue
        if got == want:
            ok += 1
            print("  → 통과\n")
        else:
            print(f"  → 실패\n     기대한 값: {want!r}\n     실제 값:   {got!r}\n")
    print(f"예제 {ok}/{len(cases)} 통과")
    sys.exit(0 if ok == len(cases) else 1)

"""공연장 좌석 SDK (시험에서 제공하는 라이브러리예요. 고치지 마세요. 채점할 땐 원본으로 바뀌어요.)

좌석 이름은 열 글자 + 번호예요. 예) "A1", "C10"
"""


class SeatError(Exception):
    """좌석 관련 오류의 부모 클래스"""


class SeatTaken(SeatError):
    """이미 누군가 잡은 좌석"""


class NoSuchSeat(SeatError):
    """없는 좌석 이름 (예: "Z1", "A0", "A01", "A11")"""


class SeatMap:
    """한 회차의 좌석 배치도.

    Args:
        rows: 열 이름들. 기본 "ABCDE"
        per_row: 한 열의 좌석 수. 기본 10
    """

    def __init__(self, rows: str = "ABCDE", per_row: int = 10):
        self.rows = rows
        self.per_row = per_row
        self._owner = {}
        self.hold_calls = 0  # hold()를 부른 횟수

    def _check(self, seat: str) -> None:
        if not isinstance(seat, str) or len(seat) < 2 or seat[0] not in self.rows:
            raise NoSuchSeat(seat)
        num = seat[1:]
        if not num.isdigit() or num != str(int(num)) or not 1 <= int(num) <= self.per_row:
            raise NoSuchSeat(seat)

    def is_free(self, seat: str) -> bool:
        """비어 있으면 True. 없는 좌석이면 NoSuchSeat"""
        self._check(seat)
        return seat not in self._owner

    def hold(self, seat: str, user: str) -> None:
        """좌석을 user 이름으로 잡아요. 이미 잡혀 있으면 SeatTaken, 없는 좌석이면 NoSuchSeat"""
        self._check(seat)
        self.hold_calls += 1
        if seat in self._owner:
            raise SeatTaken(seat)
        self._owner[seat] = user

    def release(self, seat: str) -> None:
        """잡은 좌석을 풀어요. 비어 있으면 아무 일도 안 해요"""
        self._check(seat)
        self._owner.pop(seat, None)

    def owner(self, seat: str):
        """좌석을 잡은 사람 이름. 비어 있으면 None"""
        self._check(seat)
        return self._owner.get(seat)

    def seats_in_row(self, row: str) -> list:
        """그 열의 좌석 이름 목록(번호순). 없는 열이면 빈 목록"""
        if not isinstance(row, str) or len(row) != 1 or row not in self.rows:
            return []
        return [f"{row}{i}" for i in range(1, self.per_row + 1)]

"""창고 재고 저장소 라이브러리 (시험에서 제공하는 라이브러리예요. 고치지 마세요. 채점할 땐 원본으로 바뀌어요.)"""


class Table:
    """키 하나에 행(dict) 하나를 두는 저장소. 실제 DB 테이블처럼 생각하면 돼요."""

    def __init__(self):
        self._rows = {}
        self.writes = 0  # upsert()를 부른 횟수

    def get(self, key):
        """행 복사본. 없으면 None"""
        row = self._rows.get(key)
        return dict(row) if row is not None else None

    def upsert(self, key, row: dict) -> None:
        """없으면 넣고 있으면 통째로 바꿔요"""
        self.writes += 1
        self._rows[key] = dict(row)

    def all(self) -> dict:
        """{키: 행 복사본}"""
        return {k: dict(v) for k, v in self._rows.items()}


class CheckpointStore:
    """작업 이름별로 '어디까지 처리했는지'(정수)를 기억해요. 처음엔 0"""

    def __init__(self):
        self._v = {}

    def read(self, job: str) -> int:
        return self._v.get(job, 0)

    def write(self, job: str, value: int) -> None:
        self._v[job] = value

<script type="text/plain" data-lib="ai-lib-retry" data-name="fake_llm.py">
"""사내 LLM SDK (시험에서 제공하는 라이브러리예요. 고치지 마세요. 채점할 땐 원본으로 바뀌어요.)

진짜 서버에 붙지 않는 연습용이에요. 어떤 호출이 실패할지는 script로 정해요.
"""
import math


class LLMError(Exception):
    """SDK 오류의 부모 클래스"""


class RateLimitError(LLMError):
    """호출이 너무 많음. 잠시 기다렸다가 다시 하면 될 수 있어요"""


class BadRequestError(LLMError):
    """요청 자체가 잘못됨. 다시 해도 안 돼요"""


class FakeLLM:
    """연습용 LLM 클라이언트.

    Args:
        script: 호출마다 무엇이 일어날지 순서대로 적은 목록.
            "ok"면 성공, 예외 클래스(RateLimitError 등)면 그 예외가 나요.
            목록이 끝나면 그 뒤로는 계속 성공해요.
    """

    def __init__(self, script=None):
        self.script = list(script or [])
        self.calls = 0      # complete()를 부른 횟수
        self.slept = []     # sleep()에 넘긴 초 목록

    def count_tokens(self, text: str) -> int:
        """글자 2개를 토큰 1개로 셈 (최소 1)"""
        return max(1, math.ceil(len(text) / 2))

    def complete(self, prompt: str) -> dict:
        """답을 받아요. 성공하면 {"text": 답, "tokens": 보낸 토큰 + 받은 토큰}"""
        self.calls += 1
        step = self.script.pop(0) if self.script else "ok"
        if step != "ok":
            raise step(f"{self.calls}번째 호출 실패")
        text = "답: " + prompt[:10]
        return {"text": text, "tokens": self.count_tokens(prompt) + self.count_tokens(text)}

    def sleep(self, seconds: float) -> None:
        """기다리기. 연습용이라 실제로 기다리지 않고 기록만 해요"""
        self.slept.append(seconds)

import pytest


def test_01_phone_formats(sol):
    """하이픈·공백·붙여 쓴 휴대폰 번호를 모두 010-****-뒤4자리로 바꾸는가"""
    t = "연락처 010-1234-5678, 01098765432, 010 2222 3333 입니다"
    assert sol.mask(t) == "연락처 010-****-5678, 010-****-5432, 010-****-3333 입니다"


def test_02_phone_inside_longer_number(sol):
    """더 긴 숫자 안에 들어 있는 010…은 건드리지 않는가"""
    t = "주문번호 20101234567890 확인"
    assert sol.mask(t) == t


def test_03_email(sol):
    """이메일은 아이디 첫 글자만 남기고 ***로 가리는가"""
    assert sol.mask("메일 kim.cj@olive.co.kr 로") == "메일 k***@olive.co.kr 로"


def test_04_rrn(sol):
    """주민번호 모양(6자리-7자리)은 뒷자리를 *******로 가리는가"""
    assert sol.mask("990101-1234567") == "990101-*******"
    assert sol.mask("990101-12345678") == "990101-12345678"


def test_05_no_pii(sol):
    """개인정보가 없으면 그대로 돌려주는가"""
    t = "배송이 3일째 안 와요. 확인 부탁드려요."
    assert sol.mask(t) == t


def test_06_chunk_overlap(sol):
    """max_chars씩 자르며 앞 조각 끝 overlap글자를 겹치는가"""
    assert sol.chunk("abcdefghij", 4, 1) == ["abcd", "defg", "ghij"]
    assert sol.chunk("abcdefghijk", 4, 1) == ["abcd", "defg", "ghij", "jk"]


def test_07_chunk_no_redundant_tail(sol):
    """마지막 조각이 앞 조각에 다 들어 있으면 만들지 않는가"""
    assert sol.chunk("abcdef", 4, 2) == ["abcd", "cdef"]
    assert sol.chunk("abc", 5, 2) == ["abc"]
    assert sol.chunk("", 5, 2) == []


def test_08_chunk_bad_args(sol):
    """overlap이 max_chars 이상이거나 음수, max_chars가 0 이하면 ValueError인가"""
    for a in ((4, 4), (4, 5), (0, 0), (4, -1)):
        with pytest.raises(ValueError):
            sol.chunk("abcdef", *a)

{ id:"sw-lib-limit", track:"sw", type:"lib", title:"API 호출 한도 제한기 (표준 라이브러리)",
  scenario:"쇼핑몰 앱의 쿠폰 API에 사용자별 호출 한도를 걸어요. 서버 없이 쓸 수 있는 RateLimiter 클래스를 solution.py에 만들어요. 시각은 숫자(초)로 넘겨받아요.",
  spec:`[구현할 클래스] solution.py
RateLimiter(limit, window)
  limit: window초 동안 허용할 호출 수, window: 초
  limit < 1 또는 window < 1 → ValueError

  .allow(key, now) -> bool
    (now - window, now] 구간에 허용된 호출이 limit개 미만이면 True를 주고 이 호출을 기록
    아니면 False (거절된 호출은 기록하지 않음)
    예) window=10이면 0초에 허용된 호출은 10초 시점부터 빠져요

  .retry_after(key, now) -> float  막혀 있으면 다시 허용될 때까지 남은 초, 아니면 0

  key(사용자)마다 따로 세요. now는 줄어들지 않는다고 가정해도 돼요.`,

[구현할 함수] solution.py
load_increment(table, ckpt, events, job="inventory") -> dict
  events: [{"seq": int, "sku": str, "qty": int, "updated_at": ISO 8601 문자열}]  seq 순서가 섞여 올 수 있어요
  1. seq가 ckpt.read(job) 이하인 이벤트는 이미 처리한 것 → 건너뜀 (skipped_old)
  2. 나머지를 seq 오름차순으로 처리
  3. 잘못된 이벤트는 적재하지 않음 (invalid)
     sku가 빈 문자열이거나 없음 / qty가 정수가 아니거나(True·False 포함) 음수 / updated_at에 시간대가 없거나 형식 오류

     행 모양: {"sku", "qty", "updated_at": 받은 문자열 그대로, "seq"}
  5. 끝나면 ckpt.write(job, 이번에 본 가장 큰 seq). invalid였던 이벤트도 포함. 새 이벤트가 없으면 그대로

  nice:["직접 쓴 테스트 코드 (test_solution.py)","명세 예시를 직접 실행해 확인"],

{ id:"ai-lib-retry", track:"ai", type:"lib", title:"LLM SDK 재시도·토큰 예산 래퍼 (SDK 활용)",
  scenario:"상담 요약 기능이 사내 LLM SDK(fake_llm.py)를 불러요. 호출이 몰리면 RateLimitError가 나고, 토큰 예산도 정해져 있어요. SDK를 감싸 재시도와 예산 관리를 하는 함수 두 개를 solution.py에 만들어요.",
  spec:`[제공 라이브러리] fake_llm.py
  FakeLLM(script=None)
    .complete(prompt) -> {"text", "tokens"}   실패하면 RateLimitError 또는 BadRequestError
    .count_tokens(text) -> int                 글자 2개 = 1토큰 (최소 1)
    .sleep(seconds)                            기다리기 (연습용이라 기록만 해요)
    .calls  complete를 부른 횟수   .slept  sleep에 넘긴 초 목록
  RateLimitError: 잠시 뒤 다시 하면 될 수 있음 / BadRequestError: 다시 해도 안 됨

[구현할 함수] solution.py
ask(client, prompt, max_retries=3, base_delay=1.0) -> dict
  성공 → {"ok": True, "text", "tokens", "attempts": 시도 횟수}
  실패 → {"ok": False, "error": "RATE_LIMIT" | "BAD_REQUEST" | "EMPTY", "attempts"}
  - RateLimitError면 client.sleep(base_delay × 2^(재시도 번호-1))만큼 기다리고 다시 해요
    예) base_delay=1 → 1초, 2초, 4초…   재시도는 처음 시도를 빼고 최대 max_retries번
  - BadRequestError는 다시 하지 않아요 (기다리지도 않음)
  - prompt가 비었거나 공백뿐이면 호출하지 않고 EMPTY, attempts 0

batch(client, prompts, budget) -> {"results": [ask 결과...], "used": 쓴 토큰 합}
  - 순서대로 ask해요. 부르기 전에 client.count_tokens(prompt)가 남은 예산(budget - used)보다 크면
    부르지 않고 {"ok": False, "error": "BUDGET", "attempts": 0}. 다음 프롬프트는 계속 시도
  - used에는 성공한 호출의 tokens만 더해요`,
  must:["ask 성공 결과 모양","RateLimitError 재시도와 두 배씩 늘어나는 대기","재시도 횟수 한도 (max_retries)","BadRequestError는 바로 실패","빈 프롬프트는 호출 안 함","batch: 예산 확인 후 건너뛰고 계속"],
  nice:["직접 쓴 테스트 코드 (test_solution.py)","명세 예시를 직접 실행해 확인"],
  deliver:"solution.py",
  sample:`from fake_llm import FakeLLM, RateLimitError

{ id:"ai-lib-mask", track:"ai", type:"lib", title:"상담 로그 개인정보 마스킹·청크 분할 (표준 라이브러리)",
  scenario:"고객 상담 기록을 LLM에 넣기 전에 개인정보를 가리고, 긴 글을 일정 길이로 잘라야 해요. re 같은 표준 라이브러리로 함수 두 개를 solution.py에 만들어요.",
  spec:`[구현할 함수] solution.py
mask(text) -> str
  휴대폰: 010-1234-5678, 01012345678, 010 1234 5678 → "010-****-5678" (모양 통일)
          앞뒤가 숫자로 이어진 더 긴 숫자 안의 010…은 건드리지 않아요
  이메일: kim.cj@olive.co.kr → "k***@olive.co.kr" (아이디 첫 글자 + ***)
  주민번호 모양: 990101-1234567 → "990101-*******" (앞뒤가 숫자로 이어지면 건드리지 않음)
  나머지 글자는 그대로

chunk(text, max_chars, overlap) -> list[str]
  max_chars 글자씩 자르고, 다음 조각은 앞 조각 끝 overlap 글자를 겹쳐 시작해요
  예) chunk("abcdefghij", 4, 1) → ["abcd", "defg", "ghij"]
  마지막 조각이 앞 조각에 다 들어 있으면 만들지 않아요. 빈 문자열 → []
  max_chars <= 0, overlap < 0, overlap >= max_chars → ValueError`,

  nice:["직접 쓴 테스트 코드 (test_solution.py)","명세 예시를 직접 실행해 확인"],
  deliver:"solution.py",

→ "연락처 010-****-5678, 메일 k***@olive.co.kr"
chunk("abcdefghijk", 4, 1) → ["abcd", "defg", "ghij", "jk"]`,

{ id:"sw-parcel", track:"sw", type:"api", title:"택배 배송 상태 API",
  scenario:"가상의 택배사가 송장별 배송 상태를 보여 주는 API가 필요해요. 현장 스캐너가 상태 이벤트를 보내고, 고객은 송장 번호로 지금 상태와 지난 이력을 봐요.",
  api:`POST /parcels                {"tracking_no","receiver","dest"}
  → 201 {"tracking_no","status":"접수"}
  같은 송장번호 다시 등록 → 409

POST /parcels/{no}/events     {"status","at"}
  → 201 송장 정보 (GET과 같은 모양)
  없는 송장 → 404 / 모르는 상태 이름 → 400 또는 422
  바로 다음 단계가 아님 → 409
  이미 받은 것과 상태·시각이 같은 이벤트 → 200, 이력은 그대로

GET  /parcels/{no}
  → 200 {"tracking_no","receiver","dest","status","history":[{"status","at"}]}
  없는 송장 → 404

GET  /parcels/delayed?now=시각
  → 200 ["송장번호", ...]  배송출발 뒤 24시간 넘게 배송완료가 없는 송장

등록 직후 상태는 접수, history는 빈 목록

{ id:"sw-coupon", track:"sw", type:"api", title:"선착순 쿠폰 발급 API",

{ id:"de-inventory", track:"de", type:"api", title:"매장 재고 증분 적재 API",
  scenario:"매장들이 매일 밤 재고 스냅샷 CSV를 보내요. 매번 전부 다시 쓰지 말고 바뀐 것만 반영하는 적재 API를 만들어요.",
  api:`POST /snapshots              {"csv":"CSV 문자열"}
  → 200 {"read","inserted","updated","unchanged","stale","quarantined"}
  열이 빠졌거나 이름이 다름 → 400 또는 422, 아무것도 반영 안 함 (열 순서는 달라도 됨)

/* 실전 규칙 (10/26 사전점검에서 확인): 문제당 AI에게 '보내는' 글이 합쳐서 500토큰, 질문은 8번까지.
   AI 답의 길이는 세지 않아요. 플랫폼 토크나이저를 알 수 없어 글자 수로 추정해요. */
const SEND_LIMIT = 500;      // 문제당 보낼 수 있는 토큰. 실제 시험 값
const Q_LIMIT = 8;           // 문제당 질문 횟수. 실제 시험 값
const HAN_TOKEN = 1.25;      // 한글 1글자 ≈ 토큰. 사전점검 예시(219자 = 203토큰, 글자당 약 0.93)에 맞춘 값. 크면 더 빨리 한도에 닿아요
const WORD_CHARS = 4;        // 영문·숫자 단어는 이 글자 수당 1토큰
const SYMBOL_TOKEN = 0.7;    // 기호(괄호·쉼표·화살표 등) 1개 ≈ 토큰. 실제 토크나이저는 기호를 따로 세는 일이 많아 넉넉히 잡음
const SPACE_TOKEN = 0.25;    // 공백·줄바꿈 1개 ≈ 토큰
const HAN_RE = /[\uac00-\ud7a3\u3131-\u318e]/g;
function estTok(text){
  const s = String(text || "");
  const han = (s.match(HAN_RE) || []).length;
  const rest = s.replace(HAN_RE, " ");
  const words = rest.match(/[A-Za-z0-9_]+/g) || [];
  const wordTok = words.reduce((a, w) => a + Math.ceil(w.length / WORD_CHARS), 0);
  const symbols = s.replace(HAN_RE, "").replace(/[A-Za-z0-9_\s]+/g, "").length;
  const spaces = (s.match(/\s/g) || []).length;
  return Math.ceil(han * HAN_TOKEN + wordTok + symbols * SYMBOL_TOKEN + spaces * SPACE_TOKEN);
}
const limited = () => S.limit === "exam" && builtin();
const sentTok = () => S.chat.filter(m=>m.role==="user").reduce((a,m)=>a+(m.sendTok!=null?m.sendTok:estTok(m.content)),0);
const builtin = () => S.env==="builtin" && !!sampleFn;

function elapsed(now=Date.now()){
  if(!S.startedAt) return 0;
  const end = S.finishedAt || now;
  const pausing = S.pausedAt && !S.finishedAt ? (end - S.pausedAt) : 0;
  return end - S.startedAt - S.pausedMs - pausing;
}

    <div class="guide-body">
    <h3>이 시험이 보려는 것 (추정)</h3>
    <p class="muted small">공식 채점 기준은 공개되지 않았어요. 사전점검 조건(AI는 문제를 못 봄, 문제당 보내는 글 500토큰·질문 8번)과 구름 AI 활용 평가가 밝힌 항목(정확성·속도, 질문 최적화, 토큰 효율, 제한된 리소스 안의 문제 해결)으로 추측한 거예요.</p>
    <ol class="tips">
      <li><b>문제를 이해하고 핵심만 골라내는 능력</b>: 500토큰으로는 문제를 통째로 보낼 수 없어요. 무엇을 AI에게 알려야 하는지 내가 판단해야 해요.</li>
      <li><b>AI에게 정확히 시키는 능력</b>: 적은 질문, 짧은 글로 원하는 코드를 한 번에 받아 내는지.</li>
      <li><b>AI 결과를 판단하는 능력</b>: AI는 문제를 모르니 빈칸을 추측으로 채워요. 그게 조건·라이브러리와 맞는지 내가 거르는지.</li>
      <li><b>결과물</b>: 숨은 테스트를 통과하는 코드. 여전히 가장 기본이에요.</li>
    </ol>
    <h3>한 문제 진행 순서 (2문제 120분 → 한 문제 50분 + 여유 20분)</h3>
    <ol class="tips">
      ${PHASES.map(p=>`<li><b>${esc(p.name)}</b> (시간의 ~${Math.round(p.until*100)}%까지): ${esc(p.hint)}</li>`).join("")}
    </ol>
    <h3>첫 질문 이렇게 (250~300토큰)</h3>
    <pre>rollbook: rb.size()->int, rb.name_of(n)->str 없으면 KeyError, rb.mark(name,date,st), rb.count(date,st)->int
def take_attendance(rb,date,rows)->dict  rows=["1:출석","2:지각"]
규칙: 공백제거, 형식·없는번호·모르는상태는 errors에 줄번호(1부터), 같은번호는 마지막, 없는학생은 결석
반환 {"출석":n,"지각":n,"결석":n,"errors":[...]}
예: ["1:출석","9:출석"] → errors [2]
질문 말고 바로: 1)전체 코드 2)놓치기 쉬운 경우 3)반례 입력 3개와 기대 결과. 가정은 주석.</pre>
    <ul class="tips">
      <li><b>라이브러리 함수 모양</b>을 꼭 넣어요. 안 주면 AI가 없는 함수를 지어내요.</li>
      <li><b>당연한 건 빼고 틀리기 쉬운 규칙만</b> 넣어요. 한글은 거의 1글자 = 1토큰, 코드 모양·영어 이름이 더 싸요.</li>
      <li><b>"질문 말고 바로 코드"</b>를 넣어요. AI가 되물으면 답하느라 토큰과 질문 횟수가 날아가요.</li>
      <li><b>AI 답 길이는 세지 않아요.</b> 코드·놓치기 쉬운 경우·반례를 한 번에 다 받아요.</li>
    </ul>
    <h3>점수 올리는 요령</h3>
    <ul class="tips">
      <li><b>고칠 때는 한 줄로</b> (50~100토큰): "없는 학생 있을 때 KeyError. 결석 기본값 처리만 고쳐". 코드 전체를 다시 보내거나 다시 달라고 하지 않아요.</li>
      <li><b>검증은 AI 없이</b>: 실행·테스트·라이브러리 찔러 보기·테스트 케이스는 토큰이 0이에요. AI의 "확인했어요"는 실행한 결과가 아니에요.</li>
      <li><b>AI 코드의 라이브러리 호출은 문서와 대조</b>: 점(.) 뒤 이름을 '제공 라이브러리'에서 찾아 이름·인자 순서를 확인해요. 라이브러리 기능을 AI가 직접 다시 짜지 않았는지도 봐요.</li>
      <li><b>반례의 기대 결과는 내가 정해요</b>: AI가 준 기대 결과는 조건과 맞춰 본 뒤 '테스트 케이스'에 넣어요.</li>
      <li><b>예비 토큰 100은 남겨요</b>: 마지막에 꼭 고쳐야 할 게 생길 수 있어요.</li>
      <li><b>다 못 풀어도 제출</b>: 숨은 테스트는 케이스별로 점수가 나요. 통과하는 부분까지 내요.</li>
      <li><b>화면 이탈 0번</b>, 실제 개인정보·키 값은 AI에 넣지 않아요.</li>
    </ul>
    </div>

`;
}

/* ───────── 보고서 저장·불러오기 ───────── */
const REPORT_STORE = "vibe-mock-reports-v1";   // 계정·GitHub 저장이 없을 때 이 브라우저에 남기는 보고서
const REPORT_KEEP = 30;                          // 브라우저에 남길 최근 보고서 수. 크면 저장 공간을 많이 씀
function readLocalReports(){ try{ return JSON.parse(localStorage.getItem(REPORT_STORE)||"{}"); }catch(e){ return {}; } }
function reportAvailable(h){ return !!(h && (h.report || h.hasReport || readLocalReports()[h.id])); }
async function storeReport(rec, md){
  if(dbApi && uid){
    try{ await dbApi.doc(`data/users/${uid}/meta/reports`).collection("items").doc(rec.id).set({ md: md.slice(0, 240000), at: rec.at }); rec.hasReport = true; return; }
    catch(e){ /* 계정 저장이 안 되면 브라우저에 남김 */ }
  }
  try{
    const all = readLocalReports(); all[rec.id] = md;
    const keep = Object.keys(all).sort().slice(-REPORT_KEEP); const out = {}; keep.forEach(k=>out[k]=all[k]);
    localStorage.setItem(REPORT_STORE, JSON.stringify(out)); rec.hasReport = true;
  }catch(e){}
}
async function loadReport(h){
  if(typeof siteLoadReport === "function" && h.report){ const md = await siteLoadReport(h); if(md) return md; }
  if(dbApi && uid){
    try{ const d = await dbApi.doc(`data/users/${uid}/meta/reports`).collection("items").doc(h.id).get(); if(d.exists) return d.data().md; }catch(e){}
  }
  const local = readLocalReports()[h.id];
  if(local) return local;
  throw new Error("이 기기에서 보고서를 찾지 못했어요.");
}
async function openReport(i){
  const h = history[i]; if(!h) return;
  S.reportRec = h; S.reportState = { loading:true }; go("report");
  try{ S.reportState = { md: await loadReport(h) }; }
  catch(e){ S.reportState = { error: (e && e.message) || "보고서를 불러오지 못했어요." }; }
  if(S.view === "report") render();
}

/* 보고서 마크다운을 화면용 HTML로 (제목·목록·표·코드·인용·굵게만) */
function mdInline(t){
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
}
function mdToHtml(md){
  const L = md.replace(/\r/g,"").split("\n"); const out = []; let i = 0;
  while(i < L.length){
    const line = L[i];
    const fence = line.match(/^(`{3,}|~{3,})/);
    if(fence){ const f = fence[1]; const buf = []; i++; while(i < L.length && !L[i].startsWith(f)) buf.push(L[i++]); i++; out.push(`<pre>${esc(buf.join("\n"))}</pre>`); continue; }
    const hm = line.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ const lv = Math.min(4, hm[1].length + 1); out.push(`<h${lv}>${mdInline(hm[2])}</h${lv}>`); i++; continue; }
    if(/^\|.*\|\s*$/.test(line)){
      const rows = []; while(i < L.length && /^\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().slice(1,-1).split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,"|"));
      const head = cells(rows[0]); const bodyRows = rows.slice(rows[1] && /^\|[\s:|-]+\|$/.test(rows[1].trim()) ? 2 : 1);
      out.push(`<div class="tablewrap"><table class="hist"><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${bodyRows.map(r=>`<tr>${cells(r).map(c=>`<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if(/^\s*-\s+/.test(line)){
      const items = []; while(i < L.length && /^\s*-\s+/.test(L[i])) items.push(L[i++].replace(/^\s*-\s+/,""));
      out.push(`<ul>${items.map(t=>{ const m=t.match(/^\[( |x)\]\s+(.*)$/); return m ? `<li class="task">${m[1]==="x"?"☑":"☐"} ${mdInline(m[2])}</li>` : `<li>${mdInline(t)}</li>`; }).join("")}</ul>`);
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(line)){
      const items = []; while(i < L.length && /^\s*\d+[.)]\s+/.test(L[i])) items.push(L[i++].replace(/^\s*\d+[.)]\s+/,""));
      out.push(`<ol>${items.map(t=>`<li>${mdInline(t)}</li>`).join("")}</ol>`);
      continue;
    }
    if(/^>\s?/.test(line)){ const buf=[]; while(i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,"")); out.push(`<blockquote>${mdInline(buf.join(" "))}</blockquote>`); continue; }
    if(!line.trim()){ i++; continue; }
    const buf = []; while(i < L.length && L[i].trim() && !/^(#{1,4}\s|\||\s*-\s|\s*\d+[.)]\s|>|`{3,}|~{3,})/.test(L[i])) buf.push(L[i++]);
    out.push(`<p>${mdInline(buf.join("\n")).replace(/\n/g,"<br>")}</p>`);
  }
  return out.join("\n");
}

// 문제 글을 [제목] 줄 단위로 나눔 (AI 출제 문제처럼 항목별 내용이 없을 때 씀)
function splitSpec(spec){
  const out = []; let cur = null;
  for(const line of String(spec || "").split("\n")){
    const m = line.match(/^\[([^\]]+)\]\s*(.*)$/);
    if(m){ cur = { h:m[1].trim(), body: m[2] ? [m[2]] : [] }; out.push(cur); }
    else if(cur) cur.body.push(line);
    else { cur = { h:"", body:[line] }; out.push(cur); }
  }
  return out.map(x => ({ h:x.h, body:x.body.join("\n").replace(/^\n+|\s+$/g, "") })).filter(x => x.body);
}
const qsec = (title, inner) => `<section class="qsec"><h3>${title}</h3>${inner}</section>`;
// "코드   설명"처럼 공백 2칸 이상으로 나뉜 줄을 (코드 | 설명) 표로 보여 줌. 좁은 칸에서도 줄이 엉키지 않게
function apiTable(text){
  const rows = String(text || "").split("\n").map(line => {
    if(!line.trim()) return `<tr class="gap"><td colspan="2"></td></tr>`;
    const indent = (line.match(/^ */)[0].length);
    const body = line.trim(), m = body.match(/^(.*?\S)\s{2,}(\S.*)$/);
    const pad = indent ? ` style="padding-left:${8 + indent * 6}px"` : "";
    return m ? `<tr><td class="c"${pad}><code>${esc(m[1])}</code></td><td class="d">${esc(m[2])}</td></tr>`
             : `<tr><td class="c" colspan="2"${pad}><code>${esc(body)}</code></td></tr>`;
  }).join("");
  return `<table class="apitable">${rows}</table>`;
}

function renderBody(text, idx){
  const parts = []; let last = 0, n = 0;
  const re = /```[^\n]*\n?([\s\S]*?)```/g; let m;
  while((m = re.exec(text))){
    if(m.index>last) parts.push(`<div class="md-msg">${mdToHtml(text.slice(last,m.index).trim())}</div>`);
    parts.push(`<div class="codebox"><div class="cb-bar"><button data-copy="${idx}:${n}">복사</button><button data-apply="${idx}:${n}">에디터에 넣기</button></div><pre>${esc(m[1])}</pre></div>`);
    last = re.lastIndex; n++;
  }
  if(last < text.length){
    // 아직 닫히지 않은 코드 블록(답을 받는 중)은 코드로 보여 줌
    const tail = text.slice(last), open = tail.match(/```[^\n]*\n?([\s\S]*)$/);
    if(open){ const pre = tail.slice(0, open.index).trim(); if(pre) parts.push(`<div class="md-msg">${mdToHtml(pre)}</div>`); parts.push(`<div class="codebox"><pre>${esc(open[1])}</pre></div>`); }
    else parts.push(`<div class="md-msg">${mdToHtml(tail.trim())}</div>`);
  }
  return parts.join("");
}

const CALL_WARN_SHARE = 0.2;  // 질문 한 번이 토큰 목표의 이 비율을 넘으면 빨갛게 표시. 작을수록 자주 경고

}

function initEditor(){
  const host = document.getElementById("editor"); if(!host) return;
  cm = null;
  const f = activeFile();
  const mode = /\.py$/.test(f.name) ? "python" : null;
  if(window.CodeMirror){ try{
    cm = window.CodeMirror(host, { value: f.body, mode, lineNumbers:true, indentUnit:4, tabSize:4, indentWithTabs:false,
      matchBrackets:true, autoCloseBrackets:true, styleActiveLine:true, lineWrapping:false, viewportMargin:30,
      readOnly: S.startedAt && !S.finishedAt ? false : "nocursor",
      extraKeys:{ Tab: c => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    "), "Shift-Tab": c => c.indentSelection("subtract") } });
    cm.on("change", () => { const af = activeFile(); af.body = cm.getValue(); syncCode(); });
  }catch(e){ cm = null; host.innerHTML = ""; } }
  if(!cm){
    host.innerHTML = `<textarea id="code" class="fallback" spellcheck="false" ${S.startedAt && !S.finishedAt ? "" : "readonly"}>${esc(f.body)}</textarea>`;
  }
  updateCount();
}
function insertIntoEditor(text){
  if(cm){
    cm.focus();
    const v = cm.getValue().trim();
    if(!v || v === STARTER_API.trim() || v === STARTER_DATA.trim() || v === starterOf(S.task).trim()) cm.setValue(text); else cm.replaceSelection(text);
    return;
  }
  const af = activeFile();
  af.body = af.body.trim() ? af.body.replace(/\s*$/,"") + "\n\n" + text : text;
  const ta = document.getElementById("code"); if(ta) ta.value = af.body;
  syncCode();
}
